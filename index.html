  .panel .rform .rdays { display: flex; flex-wrap: wrap; gap: 10px; }
  .panel .rform input[type=number] { width: 90px; }
  .panel .jobresult { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 8px; }
  .panel .jobtext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.5; color: var(--fg); }
  .panel .jobtext a { color: var(--accent-ink); }
  .panel .jobresult details summary { cursor: pointer; font-size: 12px; color: var(--dim); }
  .panel .hookhelp { margin-top: 18px; font-size: 13px; color: var(--dim); }
  .panel .hookhelp summary { cursor: pointer; }
  .panel .hookhelp pre { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }

  /* Home: this person's panels (src/app/ui/Home.ts), as Hark draws its own
     but across the whole page rather than in a column: a card a panel, a tile
     a thing, with its icon, what it is doing and the buttons that follow from
     it, drawn in colour while it is lit, open, unlocked or charging. The cards
     are laid out in the order they were made: a big one (.big) across the
     page, the others in columns — three on a wide screen, two in the car, one
     on a phone — each under the last, so a new or folded panel leaves no hole.
     The columns are an inner element, since a multi-column box of fixed height
     would run on sideways rather than scroll. Each card folds to its title,
     and its … menu reloads or removes it. The orb steps into the corner, as in
     Chat. With no panels yet, Hark's clock. */
  #home { display: none; }
  body.home { justify-content: flex-start; --orb: 40px;
    padding: calc(var(--barTop) + 64px) 16px calc(16px + env(safe-area-inset-bottom)); }
  body.home #orbWrap { position: fixed; top: calc(var(--barTop) + 6px); left: 18px; z-index: 3; width: var(--orb); margin: 0; }
  body.home h1, body.home #talkrow, body.home #transcript { display: none; }
  /* A session started here (the orb in the corner) says how it is going, as in Chat. */
  body.home #status { position: fixed; z-index: 20; left: 16px; right: 16px; top: auto; max-width: none; min-height: 0;
    bottom: calc(12px + env(safe-area-inset-bottom)); text-align: center; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
  body.home #home { --fold: 190px; display: block; width: min(1240px, 100%); flex: 1; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain; padding-bottom: 8px; }
  /* Laid out by ui/HomeWall.ts: columns filled across then down, so a panel dropped on another's place takes it; a big one across. */
  #home .hwall, #home .hcol { display: grid; gap: 16px; align-content: start; min-width: 0; }
  #home .hcols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  #home .hcard { position: relative; display: grid; gap: 12px; padding: 10px 16px 16px;
    border-radius: 24px; background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  #home .hcard:has(.hmenu:not([hidden])) { z-index: 6; }
  #home .hhead { position: relative; display: flex; align-items: center; gap: 8px; }
  #home .hfold { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0;
    border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #home .hfold h3 { flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #home .hfold::after, #home .hmore::before, #home .hmenu button::before, #home .hic::before { content: "";
    background: currentColor; -webkit-mask: var(--icon, var(--i-dot)) center / contain no-repeat; mask: var(--icon, var(--i-dot)) center / contain no-repeat; }
  #home .hfold::after { --icon: var(--i-chevron); flex: none; width: 18px; height: 18px; color: var(--dim);
    transform: rotate(-90deg); transition: transform .2s; }
  #home .hcard:not(.tall) .hfold { cursor: grab; }
  #home .hcard:not(.tall) .hfold::after { display: none; }
  /* Folded, as Hark folds a card: its first row stays, the next fading out under it. */
  #home .hcard.tall.folded .hfold::after { transform: rotate(90deg); }
  #home .hcard.tall.folded .hgrid { max-height: var(--fold); overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 48px), transparent);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 48px), transparent); }
  #home .hmore { flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0;
    border-radius: 50%; background: var(--wash); color: var(--fg); font-size: 0; cursor: pointer; --icon: var(--i-more); }
  #home .hmore::before { width: 20px; height: 20px; }
  #home .hmenu { position: absolute; z-index: 1; top: 52px; right: 0; display: grid; min-width: 220px; padding: 6px;
    border: 1px solid var(--hair); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
  #home .hmenu[hidden] { display: none; }
  #home .hmenu button { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 0;
    border-radius: 12px; background: none; color: var(--fg); font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
  #home .hmenu button::before { flex: none; width: 18px; height: 18px; }
  #home .hmenu button:hover { background: var(--wash); }
  #home .hmenu .hreload { --icon: var(--i-refresh); }
  #home .hmenu .hask { --icon: var(--i-reply); }
  #home .hmenu .habout { --icon: var(--i-clock); }
  #home .hmenu .hremove { --icon: var(--i-trash); color: var(--danger); }
  /* More info (ui/Home.ts infoOf): how often each thing on a panel is read, from where, when last and when next. */
  #home .hinfo { position: relative; display: grid; gap: 8px; margin: 0 0 12px; padding: 12px 52px 12px 14px; border-radius: 16px;
    background: var(--wash); color: var(--dim); font-size: 13px; line-height: 1.45; }
  #home .hinfo p { margin: 0; }
  #home .hinfo b { color: var(--fg); font-weight: 500; }
  #home .hinfo a { color: var(--accent-ink); }
  #home .hinfox { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
    border: 0; border-radius: 50%; background: none; color: var(--dim); cursor: pointer; }
  #home .hinfox::before { content: ""; width: 16px; height: 16px; background: currentColor;
    -webkit-mask: var(--i-close) center / contain no-repeat; mask: var(--i-close) center / contain no-repeat; }
  /* A panel in the making (ui/Home.ts building): its tiles breathing until the panel itself takes its place, as Hark's do. */
  #home .hsketch { pointer-events: none; }
  #home .hsketch h3 { flex: 1; margin: 0; font-size: 16px; font-weight: 500; color: var(--dim); }
  #home .hsketch .htile { min-height: 84px; animation: hsketch 1.4s ease-in-out infinite; }
  @keyframes hsketch { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { #home .hsketch .htile { animation: none; } }
  #home .hmenu .hremove.armed { background: var(--danger); color: var(--on-accent); }
  #home .hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); grid-auto-flow: row dense; gap: 10px; }
  #home .hmember { --tint: var(--warn); --on-tint: var(--fg); }
  #home .htile { --tint: var(--warn); --on-tint: var(--fg); display: flex; flex-direction: column; min-width: 0; padding: 12px;
    border-radius: 18px; background: var(--tile); transition: background .25s; }
  @media (min-width: 360px) { #home .htile.wide { grid-column: span 2; } }
  /* The usage is a strip of its own, its figures side by side, so the tiles beside it keep their height. */
  #home .htile.usage { grid-column: 1 / -1; }
  #home .htile.active { background: color-mix(in srgb, var(--tint) 10%, var(--tile)); }
  #home :is(.htile, .hmember):is([data-icon=gate], [data-icon=garage], [data-icon=door], [data-icon=window], [data-icon=blind],
    [data-icon=unlock], [data-icon=climate], [data-icon=motion], [data-icon=music]) { --tint: var(--accent-ink); --on-tint: var(--on-accent); }
  #home :is(.htile, .hmember):is([data-icon=car], [data-icon=bolt], [data-icon=alarm]) { --tint: var(--ok); --on-tint: var(--on-accent); }
  #home :is(.htile, .hmember)[data-icon=alert] { --tint: var(--danger); --on-tint: var(--on-accent); }
  #home .htop { display: flex; align-items: center; gap: 10px; }
  #home .htext { flex: 1; min-width: 0; display: grid; gap: 1px; }
  #home .hic { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
    background: var(--wash); color: var(--dim); transition: background .25s, color .25s; }
  #home .hic::before { width: 22px; height: 22px; }
  /* Its own disc only: a room's lights inside an open tile are lit or not each by themselves. */
  #home :is(.htile.active > .htop, .hmember.active) > .hic { background: color-mix(in srgb, var(--tint) 22%, transparent); color: var(--tint); }
  /* On a light page a pale tint washes out (amber on white most of all): the disc is filled with the
     colour, its icon dark on amber and white on the rest, and the tile is tinted over white, not grey. */
  :root[data-theme="light"] #home .htile.active { background: color-mix(in srgb, var(--tint) 12%, var(--surface)); }
  :root[data-theme="light"] #home :is(.htile.active > .htop, .hmember.active) > .hic { background: var(--tint); color: var(--on-tint); }
  #home .hhead .hic { width: 32px; height: 32px; background: var(--accent); color: var(--on-accent); }
  #home .hhead .hic::before { width: 18px; height: 18px; }
  #home .hbadge { flex: none; align-self: flex-start; color: var(--dim); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
  #home .hname { font-size: 14px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
  #home .hstate { color: var(--dim); font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
  #home .hstate.hwhy { color: var(--faint); }
  #home .hbar { height: 6px; margin-top: 12px; border-radius: 3px; background: var(--wash); overflow: hidden; }
  #home .hbar > i { display: block; height: 100%; border-radius: inherit; background: var(--ok); }
  #home .hbar.low > i { background: var(--danger); }
  #home .hstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin-top: 10px; }
  #home .hstat { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--wash); }
  #home .hstat small { color: var(--dim); font-size: 12px; }
  #home .hstat b { font-size: 24px; font-weight: 500; line-height: 1.2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #home .hstat b small { color: var(--dim); font-size: 15px; font-weight: 400; }
  #home .hacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 12px; }
  #home .hacts button { flex: 1 1 auto; min-height: 44px; padding: 0 14px; border: 1px solid var(--hair); border-radius: 12px;
    background: var(--chip); color: var(--fg); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  #home .hacts button:disabled { opacity: .5; cursor: default; }
  #home [data-icon=house] { --icon: var(--i-house); } #home [data-icon=gate] { --icon: var(--i-gate); }
  #home [data-icon=garage] { --icon: var(--i-garage); } #home [data-icon=door] { --icon: var(--i-door); }
  #home [data-icon=window] { --icon: var(--i-window); } #home [data-icon=blind] { --icon: var(--i-blind); }
  #home [data-icon=lock] { --icon: var(--i-lock); } #home [data-icon=unlock] { --icon: var(--i-unlock); }
  #home [data-icon=light] { --icon: var(--i-bulb); } #home [data-icon=power] { --icon: var(--i-power); }
  #home [data-icon=plug] { --icon: var(--i-plug); } #home [data-icon=fan] { --icon: var(--i-fan); }
  #home [data-icon=climate] { --icon: var(--i-snow); } #home [data-icon=scene] { --icon: var(--i-sparkle); }
  #home [data-icon=play] { --icon: var(--i-play); } #home [data-icon=press] { --icon: var(--i-press); }
  #home [data-icon=temp] { --icon: var(--i-temp); } #home [data-icon=drop] { --icon: var(--i-drop); }
  #home [data-icon=bolt] { --icon: var(--i-bolt); } #home [data-icon=motion] { --icon: var(--i-person); }
  #home [data-icon=sensor] { --icon: var(--i-gauge); } #home [data-icon=weather] { --icon: var(--i-cloud); }
  #home [data-icon=music] { --icon: var(--i-music); } #home [data-icon=car] { --icon: var(--i-car); }
  #home [data-icon=usage] { --icon: var(--i-bars); } #home [data-icon=note] { --icon: var(--i-note); }
  #home [data-icon=alarm] { --icon: var(--i-shield); } #home [data-icon=alert] { --icon: var(--i-bell); }
  #home [data-icon=calendar] { --icon: var(--i-calendar); } #home [data-icon=mail] { --icon: var(--i-mail); }
  #home [data-icon=camera] { --icon: var(--i-camera); } #home [data-icon=clock] { --icon: var(--i-clock); }
  #home [data-icon=terminal] { --icon: var(--i-terminal); } #home [data-icon=route] { --icon: var(--i-route); }
  #home [data-icon=chat] { --icon: var(--i-messages); } #home [data-icon=web] { --icon: var(--i-globe); }
  #home .hwhen { display: block; margin-top: 8px; color: var(--faint); font-size: 12px; }
  #home .hreply { display: block; margin-top: 8px; color: var(--dim); font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
  #home .hreply.hwhy { color: var(--faint); }
  #home .hreply:empty { display: none; }
  #home .halerts { display: block; margin-top: 8px; color: var(--accent-ink); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
  /* A checklist (ui/Home.ts todo): a row each, a round tick, struck through once ticked, and
     a box to type the next one straight onto the panel. */
  #home .htile.note { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 8px; min-height: 0; padding: 4px 12px 4px 4px; }
  #home .htick { position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
    border: 0; border-radius: 50%; background: none; color: var(--dim); cursor: pointer; }
  #home .htick::before { content: ""; width: 24px; height: 24px; border: 2px solid currentColor; border-radius: 50%; box-sizing: border-box; }
  #home .htile.note.done .htick { color: var(--ok); }
  #home .htile.note.done .htick::before { border: 0; background: currentColor; }
  #home .htile.note.done .htick::after { content: ""; position: absolute; width: 16px; height: 16px; background: var(--on-accent);
    -webkit-mask: var(--i-tick) center / contain no-repeat; mask: var(--i-tick) center / contain no-repeat; }
  #home .htile.note.done .hname { color: var(--dim); font-weight: 400; text-decoration: line-through; }
  #home .hadd { display: flex; gap: 8px; }
  #home .hcard.folded .hadd { display: none; }
  #home .hadd input { flex: 1; min-width: 0; min-height: 44px; padding: 0 14px; border: 1px solid var(--hair); border-radius: 12px;
    background: var(--field); color: var(--fg); font: inherit; font-size: 16px; }
  #home .hadd input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #home .hadd button { flex: none; min-height: 44px; padding: 0 16px; border: 1px solid var(--hair); border-radius: 12px;
    background: var(--chip); color: var(--fg); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  #home .hmenu .hclear { --icon: var(--i-checks); }
  /* A slider (ui/HomeMore.ts): a light's brightness, a fan's speed, a volume; and words typed for a button. */
  #home .hlevel { display: grid; grid-template-columns: auto minmax(0, 1fr) 4.5ch; align-items: center; gap: 12px; min-height: 44px; }
  #home .hlevel small { color: var(--dim); font-size: 13px; }
  #home .hlevel b { font-size: 14px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }

  #home .hacts :is(.hlevel, .htyped), #home .hmember .hlevel { flex: 1 0 100%; }
  #home .hmember { flex-wrap: wrap; }
  #home .htyped { display: flex; gap: 8px; min-width: 0; }
  /* width 0: an input's own width (about twenty characters) would otherwise hold the row wider than its tile. */
  #home .htyped input { flex: 1; width: 0; min-width: 0; min-height: 44px; padding: 0 14px; border: 1px solid var(--hair); border-radius: 12px;
    background: var(--field); color: var(--fg); font: inherit; font-size: 16px; }
  #home .htyped input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #home .htyped button { flex: none; }
  /* Beyond words (ui/HomeChart.ts): a short list, a trend as a line, a place as a map. */
  #home .hlist { margin: 10px 0 0; padding: 0 0 0 18px; color: var(--fg); font-size: 13px; line-height: 1.5; }

  #home .hchart figcaption small { color: var(--dim); font-size: 12px; }
  #home .hchart figcaption b { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
  #home .hchart svg { display: block; width: 100%; height: 90px; overflow: visible; }
  #home .hchart .hline { fill: none; stroke: var(--accent-ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  #home .hchart .harea { fill: color-mix(in srgb, var(--accent-ink) 14%, transparent); stroke: none; }
  #home .hends { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; }
  #home .hmap { display: block; width: 100%; aspect-ratio: 640 / 300; margin-top: 10px; border-radius: 12px; object-fit: cover; background: var(--wash); }
  #home .hextra:empty { display: none; }
  /* A tile wired to a tool: its reading, a few lines of it, and a picture when the tool gives one (a camera). */
  #home .htile.tile .hstate { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #home .hshot { display: block; width: 100%; margin-top: 10px; border-radius: 12px; }
  /* Opened (ui/HomeMore.ts): across its panel, as Hark opens a row. Its name and icon are what open it. */
  #home .htile.can-open .htop { cursor: pointer; border-radius: 12px; }
  /* Small, and into the padding: every thing in the house opens now ("Alert me"), and a narrow tile's name needs the room. */
  #home .htile.can-open .htop::after { content: ""; flex: none; align-self: center; width: 12px; height: 12px; margin: 0 -4px 0 auto;
    background: var(--dim); -webkit-mask: var(--i-chevron) center / contain no-repeat; mask: var(--i-chevron) center / contain no-repeat;
    transform: rotate(90deg); transition: transform .2s; }
  #home .htile.open { grid-column: 1 / -1; }
  #home .htile.open .htop::after { transform: rotate(-90deg); }
  #home .hbody { display: none; }
  #home .htile.open .hbody { display: grid; gap: 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); }
  #home .hmembers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  #home .hmember { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 6px 6px 6px 10px; border-radius: 14px; background: var(--wash); }
  #home .hmember .hic { width: 32px; height: 32px; }
  #home .hmember .hic::before { width: 18px; height: 18px; }
  #home :is(.hmember, .hdial, .hchips, .halarm, .halert) button { flex: none; min-height: 44px; padding: 0 14px; border: 1px solid var(--hair); border-radius: 12px;
    background: var(--chip); color: var(--fg); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  #home :is(.hmember, .hdial, .hchips, .halarm, .halert) button:disabled { opacity: .5; cursor: default; }
  #home .hclimate { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; }
  #home .hdial { display: flex; align-items: center; gap: 14px; }
  #home .hdial button { width: 52px; height: 52px; padding: 0; border-radius: 50%; font-size: 24px; line-height: 1; }
  #home .hdial div { display: grid; justify-items: center; min-width: 4.5ch; }
  #home .hdial b { font-size: 34px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #home .hdial small { color: var(--dim); font-size: 12px; }
  #home .hchips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #home .hchips small { min-width: 3em; color: var(--dim); font-size: 12px; }
  #home .hchips button { border-radius: 999px; }
  #home .hchips button[aria-pressed="true"] { background: var(--solid); border-color: transparent; color: var(--on-solid); }
  #home .halarm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  /* "Alert me" (ui/HomeMore.ts): its chips, a number or words, and what the server answered under them. */
  #home .halert { display: grid; gap: 8px; }
  #home .halert .hwhen { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.4; }
  #home .halert .hwhen:empty { display: none; }
  #home .hnum { width: 6.5em; }
  #home :is(.hcode, .hnum) { min-height: 44px; padding: 0 14px; border: 1px solid var(--hair); border-radius: 12px;
    background: var(--field); color: var(--fg); font: inherit; font-size: 16px; }
  #home .hcode { width: 9em; }
  #home .hcode:not(:placeholder-shown) { letter-spacing: .3em; }
  #home :is(.hcode, .hnum):focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Moved by its name (ui/HomeWall.ts), a panel or a thing on one: it follows the pointer, its place held open under it. */
  #home :is(.htile .htop, .htile.note .hname) { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #home :is(.hcard, .htile).hgap { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none;
    outline: 2px dashed var(--line); outline-offset: -2px; }
  #home :is(.hcard, .htile).hgap > * { visibility: hidden; }
  #home :is(.hcard, .htile).hlift { position: fixed; z-index: 20; margin: 0; pointer-events: none; transform: scale(1.02); box-shadow: var(--shadow); }
  /* A tile's colour is a wash over its panel: lifted off it, it keeps the panel's glass under it. */
  #home .htile.hlift { background-color: var(--glass-hi); background-image: linear-gradient(var(--tile), var(--tile));
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  #home .htile.active.hlift { background-image: linear-gradient(color-mix(in srgb, var(--tint) 10%, var(--tile)), color-mix(in srgb, var(--tint) 10%, var(--tile))); }
  body.hdragging { cursor: grabbing; -webkit-user-select: none; user-select: none; }
  #home .hclock { display: grid; margin-top: 6vh; font-size: clamp(40px, 8vmin, 64px); line-height: 1.08; }
  #home .hnote { margin: 4px 0 12px; color: var(--dim); font-size: 15px; line-height: 1.45; max-width: 460px; }

  /* Theme (src/app/ui/ThemePanel.ts): one choice of four, a ring marking it. */
  .panel .navcard > button[role=radio] { grid-template-columns: minmax(0, 1fr) 22px; row-gap: 2px; padding: 10px 20px; }
  .panel .navcard > button[role=radio] > * { grid-column: 1; }
  .panel .navcard > button[role=radio] small { color: var(--dim); font-size: 13px; }
  .panel .navcard > button[role=radio]::before { content: none; }
  .panel .navcard > button[role=radio]::after { grid-column: 2; grid-row: 1 / span 2; width: 22px; height: 22px;
    box-sizing: border-box; border-radius: 50%; border: 2px solid var(--faint); background: none; -webkit-mask: none; mask: none; }
  .panel .navcard > button[role=radio][aria-checked="true"]::after { border: 7px solid var(--accent); }
</style>
</head>
<body>
  <h1 id="title">JARVIS</h1>
  <button id="menuBtn" type="button" aria-label="Menu" aria-haspopup="dialog" aria-expanded="false"></button>
  <div id="hub" role="dialog" aria-modal="true" aria-label="Menu">
    <header class="hubhead">
      <span id="hubAvatar" class="avatar" aria-hidden="true"></span><b id="hubName">Jarvis</b>
    </header>
    <div id="topbtns" role="menu" aria-label="Menu">
      <!-- data-need: what a family member must be allowed for the item to be offered (main.ts). -->
      <div class="hubgroup" role="group">
        <button id="openMemory" type="button" role="menuitem" data-need="memory.read">Memory</button>
        <button id="openRoutines" type="button" role="menuitem" data-need="routines">Routines</button>
        <button id="openJobs" type="button" role="menuitem" data-need="ask">Jobs</button>
      </div>
      <div class="hubgroup" role="group">
        <button id="openChat" type="button" role="menuitem" data-need="chat" hidden>Messages</button>
        <button id="openFamily" type="button" role="menuitem">Family</button>
      </div>
      <div class="hubgroup" role="group">
        <button id="openDevices" type="button" role="menuitem" data-need="ask">Devices</button>
        <button id="openSettings" type="button" role="menuitem" data-need="admin">Settings</button>
      </div>
      <div class="hubgroup" role="group">
        <button id="openTheme" type="button" role="menuitem">Theme</button>
        <button id="toggleLog" type="button" role="menuitem">Events</button>
      </div>
    </div>
  </div>
  <!-- Outside the page it closes, which scrolls: a fixed child of it would scroll away. -->
  <button id="hubClose" type="button" aria-label="Close"></button>

  <div id="tabs" role="group" aria-label="View">
    <span class="pill" aria-hidden="true"></span>
    <button type="button" data-tab="jarvis" aria-pressed="true">Jarvis</button>
    <button type="button" data-tab="chat" aria-pressed="false">Chat</button>
    <!-- data-need: a guest has no screen, so no Home tab (main.ts whoAmI). -->
    <button type="button" data-tab="home" data-need="screen" aria-pressed="false">Home</button>
  </div>

  <!-- The orb, what it is doing on its left and how to talk on its right; under it on a phone held upright (#orbRow). -->
  <div id="orbRow">
    <div id="orbWrap">
      <canvas id="orbCanvas" aria-hidden="true"></canvas>
      <button id="orb" class="orb" aria-label="Start or stop Jarvis"></button>
    </div>
    <div id="said">
      <div id="status">loading…</div>
    </div>
    <div id="talkrow">
      <div id="modes" role="group" aria-label="How to talk">
        <button type="button" data-mode="live">Live</button>
        <button type="button" data-mode="ptt">Push-to-talk</button>
      </div>
    </div>
  </div>
  <div id="chathead"><button id="clearChat" type="button">Clear chat</button></div>
  <div id="transcript"></div>
  <section id="home" aria-label="Your panels"></section>
  <form id="typebar" autocomplete="off">
    <!-- What goes with the question: the answer it replies to, its photos and files (reply.ts, attach.ts). -->
    <div id="tray" hidden></div>
    <textarea id="typed" rows="1" placeholder="Message Jarvis…" aria-label="Message Jarvis" enterkeyhint="send"></textarea>
    <button id="attach" type="button" title="Add a photo or file" aria-label="Add a photo or file" aria-haspopup="menu" aria-expanded="false"></button>
    <div id="attachMenu" role="menu" hidden>
      <button type="button" role="menuitem" data-pick="file">Upload file</button>
      <button type="button" role="menuitem" data-pick="photo">Take photo</button>
    </div>
    <input id="attachInput" type="file" multiple hidden accept="image/*,application/pdf,text/*,.md,.csv,.tsv,.json,.log,.xml,.yaml,.yml">
    <button id="askAloud" type="button" title="Dictate" aria-label="Dictate" aria-pressed="false"></button>
    <button id="readAloud" type="button" aria-pressed="false" title="Read replies aloud" aria-label="Read replies aloud"></button>
    <button id="send" type="submit" aria-label="Send"></button>
  </form>

  <div id="unlock">
    <h2 id="unlockName" style="margin:0;font-weight:300;letter-spacing:8px;font-size:22px">JARVIS</h2>

    <!-- Signing in as yourself: a passkey here, or this screen paired with your phone. -->
    <div id="signIn" class="uview">
      <p>Sign in once on this screen.</p>
      <button id="passkeyGo" class="big">Sign in with a passkey</button>
      <button id="pairGo" class="big alt">Pair with my phone</button>
      <button id="signInBack" class="big alt" hidden>Back</button>
    </div>

    <!-- A screen several people share: who is using it now (src/app/people.ts). -->
    <div id="peopleView" class="uview" hidden>
      <p id="peopleText">Who's using Jarvis?</p>
      <div id="peopleList" class="people"></div>
      <button id="peopleAdd" class="big alt">Add someone</button>
      <button id="peopleBack" class="big alt" hidden>Back</button>
    </div>

    <!-- Their PIN, to switch into someone who has one. -->
    <div id="pinView" class="uview" hidden>
      <p id="pinText"></p>
      <input id="pinInput" class="field" type="password" inputmode="numeric" pattern="[0-9]*"
             maxlength="8" autocomplete="off" placeholder="PIN">
      <button id="pinGo" class="big">Unlock</button>
      <button id="pinBack" class="big alt">Back</button>
    </div>

    <!-- A code for a signed-in phone to approve: Family → Sign in another screen. -->
    <div id="pairView" class="uview" hidden>
      <p>On your phone, open Jarvis → <b>Family</b> → <b>Sign in another screen</b>, and enter</p>
      <div id="pairCode" class="paircode">······</div>
      <p id="pairLeft" class="dim"></p>
      <button id="pairCancel" class="big alt">Cancel</button>
    </div>

    <!-- Opened from an invite link. -->
    <div id="joinView" class="uview" hidden>
      <p id="joinText"></p>
      <input id="joinName" class="field" autocomplete="name" maxlength="40" placeholder="Your name">
      <button id="joinGo" class="big">Create my passkey</button>
      <p class="dim">Face ID, a fingerprint or your phone's PIN. No password.</p>
    </div>

    <!-- The deployment's owner key: how a Jarvis without a family is used, and the way back in. -->
    <details id="keyWrap" class="uview">
      <summary>Use the owner key</summary>
      <input id="keyInput" autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false" inputmode="latin"
             maxlength="24" placeholder="XXXXXXXXXXXXXXXX">
      <button id="keyGo">Unlock</button>
    </details>
    <div id="keyErr"></div>
  </div>

  <div id="alerts" aria-live="polite"></div>
  <div id="logWrap"><div id="log"></div></div>
  <audio id="remote" autoplay playsinline></audio>

  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
