<!-- Paints the theme last shown before the first frame, so a daytime reload does not flash
     black. It holds no rule of its own: src/app/theme.ts decides, and corrects it at once. -->

    --seg-on: #393c41;

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    overscroll-behavior: none;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  /* dvh, because a phone's toolbar collapses and 100% then crops the orb.
     Harmless in the car, which has no such toolbar. */
  body { height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 22px; padding: calc(var(--barTop) + 56px) 20px 20px;
    background: var(--backdrop); }

  h1 { position: fixed; top: calc(var(--barTop) + 14px); left: 22px; margin: 0; font-size: 15px;
    font-weight: 400; letter-spacing: 6px; color: var(--dim);
    max-width: calc(50vw - 140px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Jarvis | Chat, Hark's pill switcher: the sliding pill marks the one in use.
     Under the sign-in screen (50), over the page; hidden while a picture is up. */
  #tabs { position: fixed; z-index: 49; top: calc(var(--barTop) + 2px); left: 50%; transform: translateX(-50%);
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 999px;
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  #tabs .pill { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 2);
    border-radius: 999px; background: var(--solid); transition: transform .25s cubic-bezier(.22,.9,.28,1); }
  body.typing #tabs .pill { transform: translateX(100%); }
  #tabs button { position: relative; min-height: 44px; padding: 0 22px; border: 0; background: none;
    font: inherit; font-size: 15px; font-weight: 500; color: var(--fg); opacity: .5; cursor: pointer;
    transition: color .15s, opacity .15s; }
  #tabs button[aria-pressed="true"] { color: var(--on-solid); opacity: 1; }
  body.staged:not(.typing) #tabs { display: none; }

  /* The orb is the only control, and it is used while driving: the hit area is
     sized generously and explicitly, because this browser now reports
     pointer:fine and anything sized off pointer:coarse would silently shrink. */
  /* The orb is a WebGL canvas. The tap target is a separate, deliberately
     oversized element over it: this browser reports pointer:fine, so nothing
     gets touch-friendly sizing for free, and it is pressed while driving. */
  #orbWrap { position: relative; width: min(38vh, 300px); aspect-ratio: 1;
    flex: none; display: grid; place-items: center; margin: 2vh 0 3vh;
    transition: width .55s cubic-bezier(.22,.9,.28,1),
                margin .55s cubic-bezier(.22,.9,.28,1),
                transform .55s cubic-bezier(.22,.9,.28,1); }

  /* When something is on screen the orb steps aside: smaller, pinned top-left,
     still animating so it is clearly alive and still the thing you tap.

     Sized against the SMALLER viewport dimension, because the Tesla gives this
     app two very different shapes: the whole screen when parked, and a narrow
     column beside the driving visualisation when moving. Everything here scales
     rather than switching at a breakpoint, so it also survives Tesla changing
     that split. --orb is the one number the rest follows. */
  body.staged { justify-content: flex-start; padding-top: 8px;
    --orb: clamp(56px, 11vmin, 96px); }
  body.staged #orbWrap { position: fixed; top: 10px; left: 12px; z-index: 61;
    width: var(--orb); margin: 0; }
  /* The canvas is inset -22%, so the orb DRAWS 1.44x its layout box and its glow
     reaches further still. Offsetting by --orb alone put the text inside that
     halo. Everything to the right of the orb is positioned from --orbSpan. */
  body.staged { --orbSpan: calc(var(--orb) * 1.44); }
  body.staged #status, body.staged #hint { position: fixed;
    left: calc(var(--orbSpan) + 18px); z-index: 61; text-align: left;
    font-size: clamp(12px, 1.6vmin, 15px);
    max-width: calc(100vw - var(--orbSpan) - 230px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.staged #status { top: calc(10px + var(--orb) / 2 - 12px); }
  body.staged #hint { top: calc(10px + var(--orb) / 2 + 8px); font-size: 11px; }
  /* Centred under the picture on a wide screen, rather than pinned left. */
  body.staged #transcript { position: fixed; left: 0; right: 0; margin-inline: auto; bottom: 6px;
    max-height: 16vh; z-index: 61; padding: 0 14px; }
  body.staged #transcript .row { font-size: clamp(12px, 1.7vmin, 15px); }

  /* A narrow viewport is the driving split. Give the picture the room. */

  /* Focus: while talking to Jarvis, everything but the orb, the status and the
     words fades away. A tap on empty space brings it back for a few seconds. */
  h1, #menuBtn, #talkrow, #tabs { transition: opacity .35s ease; }
  body.focus:not(.peek) h1,
  body.focus:not(.peek) #menuBtn,
  body.focus:not(.peek) #tabs,
  body.focus:not(.peek) #talkrow { opacity: 0; pointer-events: none; }

  #orbCanvas { position: absolute; inset: -22%; width: 144%; height: 144%;
    display: block; pointer-events: none; }
  #orb { position: absolute; inset: 0; border-radius: 50%; cursor: pointer;
    background: transparent; border: 0; -webkit-appearance: none; appearance: none; }
  #orb:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
  #orb.connecting { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .9 } 50% { opacity: 1 } }
  /* Fallback if WebGL is unavailable: the app must still be usable. */
  #orbWrap.nogl #orb { background: radial-gradient(circle at 50% 42%,
      color-mix(in srgb, var(--accent) 35%, var(--surface)) 0%, color-mix(in srgb, var(--accent) 12%, var(--bg)) 70%);
    box-shadow: 0 0 0 1px var(--hair) inset, 0 0 70px -14px var(--accent); }

  #status, #hint, #transcript { position: relative; z-index: 2; }
  #status { font-size: 17px; color: var(--dim); text-align: center; min-height: 24px; }
  #status.bad { color: var(--danger); }
  #hint { font-size: 12px; color: var(--faint); min-height: 16px; font-variant-numeric: tabular-nums; }

  #transcript { width: min(760px, 100%); max-height: 26vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; padding: 0 4px; }
  /* Bubbles, as Hark's chat has them: Jarvis on the left, you on the right.
     Who said it is plain from the side, so the name is there for screen
     readers only. */
  .row { display: flex; flex-direction: column; align-items: flex-start; font-size: 15px; line-height: 1.4; }
  .row.you { align-items: flex-end; }
  .row .who { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .row .txt { max-width: min(480px, 88%); padding: 12px 16px; border-radius: 22px;
    background: var(--bubble); color: var(--fg); overflow-wrap: anywhere; }
  .row.you .txt { background: var(--bubble-you); }

  #logWrap { position: fixed; inset: auto 0 0 0; height: 0; overflow: hidden;
    background: var(--surface); border-top: 1px solid var(--hair); transition: height .2s ease; }
  #logWrap.open { height: 42vh; }
  #log { height: 100%; overflow-y: auto; padding: 10px 14px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ln { display: flex; gap: 10px; border-bottom: 1px solid var(--hair); padding: 2px 0; }
  .ln .t { flex: none; width: 250px; color: var(--accent-ink); }
  .ln .t.e { color: var(--danger); }
  .ln .j { color: var(--faint); word-break: break-all; }

  /* The sheets: settings, devices and memory. Both are phone-or-laptop jobs rather than
     driving ones — each means typing something the Tesla keyboard makes
     miserable. One shared class, because two id selectors per rule is how you
     end up with `#settings, #devices .sheet` styling the whole overlay. */
  .panel { position: fixed; inset: 0; background: var(--scrim); z-index: 60;
    display: none; align-items: center; justify-content: center; padding: 20px; }
  .panel.open { display: flex; }
  .panel .sheet { width: min(760px, 100%); max-height: 86dvh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 20px; }
  .panel header { display: flex; align-items: center; justify-content: space-between; }
  .panel h2 { margin: 0; font-size: 18px; font-weight: 500; }
  .panel .note { color: var(--dim); font-size: 13px; margin: 6px 0 16px; }
  .panel .note:empty { display: none; }
  .panel code { background: var(--wash); padding: 1px 5px; border-radius: 4px; }
  .panel .srv { display: grid; gap: 8px; padding: 12px; margin-bottom: 10px;
    border: 1px solid var(--hair); border-radius: 10px; background: var(--tile); }
  .panel input[type=text], .panel .srv input:not([type=checkbox]), .panel .svc input:not([type=checkbox]) {
    background: var(--field); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 12px; font-size: 16px; font-family: inherit; min-height: 44px; width: 100%; }
  .panel .on { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .panel .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .panel button { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 16px; min-height: 44px; font: 14px inherit; cursor: pointer; }
  .panel button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .panel .actions { display: flex; gap: 10px; margin-top: 8px; }
  .panel .res, .panel .msg { font: 12px/1.5 ui-monospace, Menlo, monospace;
    color: var(--faint); word-break: break-word; margin-top: 8px; }
  .panel .res.bad, .panel .msg.bad { color: var(--danger); }
  .panel h3 { margin: 22px 0 0; font-size: 14px; font-weight: 500; color: var(--fg); }
  .panel .router { display: grid; gap: 10px; padding: 14px; margin-top: 14px;
    border: 1px solid var(--hair); border-radius: 10px; background: var(--tile); }
  .panel .router h3 { margin: 0; }
  .panel .router .note { margin: 0; }
  .panel .now { font-size: 14px; color: var(--dim); display: grid; gap: 6px; }
  .panel .now b { color: var(--fg); font-weight: 600; }
  .panel .warn { color: var(--danger); font-size: 13px; line-height: 1.45; }
  /* 16px so iOS and Android do not zoom the page when it takes focus. */
  .panel select { background: var(--field); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 12px; font-size: 16px; font-family: inherit; min-height: 44px; width: 100%; }
  .panel button:disabled, .panel select:disabled { opacity: .45; cursor: default; }

  /* Every setting (src/app/ui/Services.ts). Secrets are never on this page —
     only a fingerprint — so a field is blank until a replacement is typed.
     One column that may shrink below its content: without minmax(0, …) a long
     unbreakable value (a redirect URI) sets the width of the whole section and
     pushes it past the edge of a phone screen. */
  .panel .svc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px; margin-top: 14px;
    border: 1px solid var(--hair); border-radius: 10px; background: var(--tile); }
  .panel .note code { overflow-wrap: anywhere; }
  .panel .inforce { font-size: 14px; color: var(--dim); }
  .panel .inforce b { color: var(--fg); font-weight: 600; }
  .panel .svc h3 { margin: 0; }
  .panel .svc .note { margin: 0; }
  .panel .svchead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .panel .chip { font-size: 11px; letter-spacing: .3px; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .panel .chip.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .panel .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel .check { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .panel .check.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .panel .field { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--hair); }
  .panel .fieldtop { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .panel .fieldtop label { font-size: 14px; color: var(--fg); }
  .panel .badge { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .panel .badge.saved { color: var(--accent-ink); }
  .panel .badge.unset { color: color-mix(in srgb, var(--warn) 60%, var(--fg)); }
  .panel .current { font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--fg); word-break: break-all; }
  .panel .current.secret { color: var(--dim); letter-spacing: .3px; }
  .panel .fieldfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .panel .fieldfoot .help { font-size: 12px; color: var(--faint); }
  .panel .fieldfoot button { min-height: 34px; padding: 4px 12px; font-size: 13px; }
  .panel .cmd { display: block; padding: 8px 10px; font-size: 13px; overflow-x: auto; white-space: nowrap; }

  /* Devices. Minting a credential is a phone-or-laptop job, never a driving one. */
  #devices .mint { display: grid; gap: 10px; padding: 14px; margin-bottom: 14px;
    border: 1px solid var(--hair); border-radius: 10px; background: var(--tile); }
  #devices .scopes { display: grid; gap: 6px; }
  #devices .scope { display: flex; align-items: flex-start; gap: 9px; font-size: 13px;
    color: var(--dim); cursor: pointer; }
  #devices .scope input { margin-top: 3px; min-width: 18px; min-height: 18px; }
  #devices .scope.wild { color: var(--fg); padding-bottom: 6px; border-bottom: 1px solid var(--hair); }
  #devices .dev { display: grid; gap: 8px; padding: 12px; margin-bottom: 10px;
    border: 1px solid var(--hair); border-radius: 10px; background: var(--tile); }
  #devices .dev.dead { opacity: .5; }
  #devices .who { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  #devices .dim { color: var(--faint); font-size: 12px; }
  #devices .grants { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  #devices button.armed, #memory button.armed, #family button.armed { background: var(--danger); border-color: var(--danger);
    color: var(--on-accent); font-weight: 600; }
  /* The one moment the token is readable, so it gets the loudest box here. */
  #devices .token, #family .token { border: 1px solid var(--accent); border-radius: 10px;
    padding: 16px; margin-bottom: 16px; background: var(--tile); }
  #devices .token p, #family .token p { color: var(--dim); font-size: 13px; margin: 8px 0; }
  #devices .tok, #family .tok { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #devices .tok code, #family .tok code { font: 13px ui-monospace, Menlo, monospace; word-break: break-all;
    flex: 1 1 260px; padding: 10px; }
  #devices .qr, #family .qr { background: #fff; padding: 10px; border-radius: 8px;
    width: max-content; margin: 12px 0; }
  #devices .qr svg, #family .qr svg { display: block; width: 190px; height: 190px; }
  /* Memory (src/app/ui/Memory.ts): every fact Jarvis carries, a section per kind, and a way to add or forget one. */
  #memory [hidden] { display: none !important; }
  #memory .setbody > .msg { margin: 0 0 10px; }
  #memory .setbody > .msg:empty { display: none; }
  #memory .gauge { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; gap: 10px;
    align-items: center; font-size: 13px; color: var(--dim); }
  #memory .bar { height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; }
  #memory .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  #memory .bar.full i { background: var(--warn); }
  #memory pre.profile { white-space: pre-wrap; word-break: break-word; margin: 0;
    font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--fg); background: var(--tile);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  #memory .addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  #memory .fpin input { min-width: 18px; min-height: 18px; }
  #memory .named { display: grid; gap: 10px; }
  #memory .find { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  #memory .found { display: grid; gap: 8px; }
  #memory .found h4 { margin: 6px 0 0; font-size: 13px; font-weight: 500; color: var(--dim); }
  #memory .fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px;
    align-items: center; padding: 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--tile); }
  #memory .ftxt { font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
  #memory .meta { grid-column: 1; font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
  #memory .fact .rowbtns { grid-column: 2; grid-row: 1 / span 2; justify-content: flex-end; }
  #memory .pin { color: var(--accent-ink); }
  #memory .dim { color: var(--faint); font-size: 12px; }
  #memory .gone { font-size: 13px; color: var(--dim); padding: 6px 0; border-top: 1px solid var(--hair); }
  @media (max-width: 520px) {
    #memory .gauge { grid-template-columns: minmax(0, 1fr); }
    #memory .fact { grid-template-columns: minmax(0, 1fr); }
    #memory .fact .rowbtns { grid-column: 1; grid-row: auto; justify-content: flex-start; }
  }

  /* The stage: a map or a street-level photo, filling the main view. */
  #stage { position: fixed; inset: 0; display: none; align-items: center;
    justify-content: center; z-index: 55; pointer-events: none;
    /* Clears the orb row above and the transcript below, at any size. */
    padding: calc(var(--orbSpan, 138px) + 14px) 12px 19vh; }
  #stage.open { display: flex; }
  #stage .frame { position: relative; max-width: 100%; max-height: 100%;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--hair);
    background: var(--surface); box-shadow: var(--shadow);
    pointer-events: auto;
    animation: stageIn .45s cubic-bezier(.22,.9,.28,1) both; }
  /* The static image is 1280x800 (640x400 at scale 2). Letting it fill a wide
     viewport upscales past its own resolution and looks soft, so cap it at
     roughly its natural size and let the panel shrink around it instead.
     Sized against the VIEWPORT, not the panel: a percentage here refers back to
     the panel, which sizes itself from the image, so the browser cannot shrink
     the panel to fit — a 1920px camera frame left the panel full width with the
     picture in its left half. --stageH is the height left between the orb row
     and the transcript (the padding on #stage). */
  #stage { --stageW: calc(100vw - 24px);
    --stageH: calc(100dvh - var(--orbSpan, 138px) - 14px - 19vh); }
  #stage img { display: block; width: auto; height: auto;
    max-width: min(var(--stageW), 980px); max-height: var(--stageH);
    object-fit: contain; background: var(--surface); }
  /* A camera frame is full HD, and seeing it large is the point. */
  #stage .frame.camera img { max-width: min(var(--stageW), 1600px); }
  /* Until the first frame arrives — seconds, over a slow link home — a
     picture-shaped space rather than a sliver with a Close button on it. */
  #stage .frame.camera img:not([src]) { width: min(var(--stageW), 640px); aspect-ratio: 16 / 9; }
  #stage iframe { display: block; border: 0; background: var(--surface);
    width: min(1000px, 92vw); height: min(560px, 58vh); }
  #stage .frame { width: auto; }
  #stage .cap { position: absolute; left: 0; right: 0; bottom: 0;
    padding: 26px 16px 12px; font-size: 15px; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.72)); }
  /* Sized to be hit without aiming. Jarvis can also close it by voice, which is
     the intended way while moving — this is the fallback, not the mechanism. */
  #stage .close { position: absolute; top: 8px; right: 8px;
    min-height: 56px; min-width: 88px; padding: 12px 20px; border-radius: 10px;
    border: 1px solid var(--hair); background: var(--surface); color: var(--fg);
    font: 600 15px inherit; cursor: pointer; }
  @keyframes stageIn { from { opacity: 0; transform: translateY(16px) scale(.97) }
                       to   { opacity: 1; transform: none } }


  /* Unlock screen. Everything here is oversized on purpose: it is used at arm's
     length on a dashboard, and this browser reports pointer:fine so nothing
     gets touch sizing for free. */
  #unlock { position: fixed; inset: 0; background: var(--bg); z-index: 50;
    display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px; }
  #unlock.show { display: flex; }
  #unlock p { color: var(--dim); margin: 0; text-align: center; font-size: 15px; }
  #keyInput { width: min(460px, 100%); height: 68px; text-align: center;
    background: var(--field); color: var(--fg); border: 1px solid var(--line);
    border-radius: 12px; font: 600 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 3px; text-transform: uppercase; }
  #keyInput:focus { outline: none; border-color: var(--accent); }
  #keyGo { width: min(460px, 100%); height: 64px; background: var(--accent);
    color: var(--on-accent); border: 0; border-radius: 12px; font: 600 19px inherit; cursor: pointer; }
  #keyGo:disabled { opacity: .35; }
  #keyErr { color: var(--danger); font-size: 14px; min-height: 20px; text-align: center; max-width: 460px; }
  #unlock .uview { width: min(460px, 100%); display: grid; gap: 14px; justify-items: stretch; }
  #unlock .uview[hidden] { display: none; }
  #unlock .dim { color: var(--dim); font-size: 13px; }
  #unlock button.big { height: 64px; background: var(--accent); color: var(--on-accent); border: 0;
    border-radius: 12px; font: 600 19px inherit; cursor: pointer; }
  #unlock button.big.alt { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
  #unlock button.big:disabled { opacity: .35; }
  #unlock .field { height: 60px; background: var(--field); color: var(--fg); border: 1px solid var(--line);
    border-radius: 12px; font: 20px inherit; padding: 0 16px; text-align: center; }
  #unlock .paircode { text-align: center; font: 600 54px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 12px; color: var(--accent-ink); padding: 12px 0; }
  #unlock details summary { color: var(--dim); font-size: 14px; cursor: pointer; text-align: center; list-style: none; }
  #unlock details summary::-webkit-details-marker { display: none; }
  #unlock details[open] { gap: 12px; }
  #unlock details[open] summary { margin-bottom: 4px; }
  #unlock details > input, #unlock details > button { display: block; width: 100%; }
  #unlock .people { display: grid; gap: 10px; }
  #unlock .people button { height: 64px; background: var(--field); color: var(--fg); border: 1px solid var(--line);
    border-radius: 12px; font: 500 20px inherit; cursor: pointer; display: flex; align-items: center;
    justify-content: space-between; padding: 0 20px; }
  #unlock .people button.now { border-color: var(--accent); }
  #unlock .people .tag { color: var(--dim); font-size: 14px; }
  #title.switchable { cursor: pointer; z-index: 58; padding: 6px 8px; margin: -6px -8px; }

  /* Viewport overrides last: these carry no extra specificity, so they only
     win by coming after the rules they override. */
  /* A phone. Narrow AND tall — where the Tesla's driving split is narrow and
     wide — so this keys on orientation as well as width, and both of the car's
     layouts are left exactly as they were. */
  @media (max-width: 620px) and (orientation: portrait) {
    /* No room for the name beside the tabs, and a phone is one person's anyway:
       switching who is using a shared screen is for the car or a tablet. */
    h1 { display: none; }
    /* Room for the tabs above and the home indicator below. */
    body { gap: 16px;
           padding: 74px 16px calc(20px + env(safe-area-inset-bottom)); }
    #orbWrap { --w: min(60vw, 40vh); width: var(--w);
      margin: 0 0 calc(var(--w) * 0.2); }
    #status { font-size: 16px; }
    #transcript { max-height: 22dvh; }
    /* A sheet rises from the bottom, which is where a thumb already is. */
    .panel { padding: 0; align-items: flex-end; }
    .panel .sheet { width: 100%; max-height: 92dvh; border-radius: 16px 16px 0 0;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    #devices .qr svg, #family .qr svg { width: 150px; height: 150px; }
    #devices .tok code, #family .tok code { flex: 1 1 100%; }
  }

  /* A desktop window has room the dashboard does not. */
  @media (min-width: 1100px) and (min-height: 760px) {
    #orbWrap { width: min(46vh, 380px); }
    #status { font-size: 19px; }
  }

  /* Live or push-to-talk, per screen, under the orb: Tesla's segmented control,
     a raised pill on a sunken track. Out of the way while a picture is up. */
  #modes { position: relative; z-index: 2; display: flex; gap: 0; padding: 2px; border-radius: 999px;
    background: var(--wash); }
  #modes button { background: transparent; color: var(--dim); border: 0; border-radius: 999px; padding: 10px 18px;
    min-height: 40px; font: inherit; font-size: 13px; cursor: pointer; }
  #modes button.on { background: var(--seg-on); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  body.staged #talkrow { display: none; }
  #talkrow { position: relative; z-index: 2; display: flex; gap: 10px; align-items: center; }

  /* The Chat tab: the orb steps into the corner, still alive and still the
     way to ask aloud; the conversation fills the screen, a message box sits at
     the bottom, and what Jarvis is doing is a caption just above it. */
  #typebar { display: none; }
  /* --kb is the height the on-screen keyboard takes where the browser does not
     shrink the page for it (Safari); 0 elsewhere. See keyboardSpace() in main.ts. */
  body.typing { justify-content: flex-start; gap: 12px; --orb: 40px;
    height: calc(100dvh - var(--kb, 0px));
    padding: calc(var(--barTop) + 64px) 16px calc(112px + env(safe-area-inset-bottom)); }
  body.typing h1, body.typing #hint, body.typing #talkrow { display: none; }
  body.typing #orbWrap { position: fixed; top: calc(var(--barTop) + 6px); left: 18px; z-index: 3; width: var(--orb); margin: 0; }
  body.typing #status { position: fixed; z-index: 20; left: 16px; right: 16px;
    bottom: calc(var(--kb, 0px) + 80px + env(safe-area-inset-bottom)); min-height: 0;
    font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.typing #transcript { flex: 1; min-height: 0; max-height: none; width: min(720px, 100%);
    padding-bottom: 8px; }
  body.typing #transcript .row { font-size: 16px; }
  body.typing #transcript .row .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  body.typing #transcript .row .txt a { color: var(--accent-ink); }
  #transcript .row.bad .txt { color: var(--danger); }
  /* The message box, Hark's: one glass pill holding the text and its buttons —
     ask aloud (what the orb does in Chat), read replies aloud, and send. */
  body.typing #typebar { display: flex; position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
    bottom: calc(var(--kb, 0px) + 12px + env(safe-area-inset-bottom)); width: min(720px, calc(100vw - 28px));
    align-items: flex-end; gap: 2px; padding: 4px; border-radius: 26px; border: 1px solid var(--hair);
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    box-shadow: var(--shadow); }
  body.typing #typebar:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  /* 16px so iOS does not zoom the page when it takes focus. */
  #typebar textarea { flex: 1; resize: none; min-height: 44px; max-height: 30vh; border: 0; background: transparent;
    padding: 11px 8px 11px 14px; color: var(--fg); font: inherit; font-size: 16px; line-height: 1.4; }
  #typebar textarea:focus { outline: none; }
  #typebar textarea::placeholder { color: var(--faint); }
  #typebar button { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: transparent; color: var(--dim); cursor: pointer; }
  #typebar button::before { content: ""; width: 22px; height: 22px; background: currentColor;
    -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  #typebar #askAloud { --icon: var(--i-mic); }
  #typebar #readAloud { --icon: var(--i-speaker); }
  #typebar #readAloud[aria-pressed="true"] { --icon: var(--i-speaking); color: var(--accent-ink); }
  #typebar #send { --icon: var(--i-send); background: var(--solid); color: var(--on-solid); }
  #typebar #send:disabled { opacity: .45; cursor: default; }
  /* A picture while typing sits at the top of the chat, not over it. The
     staged rules above float the conversation over a dashboard; with typing's
     unlimited height that layer covered the picture, the orb and the menu.
     The picture takes up to 42% of what the keyboard leaves, the chat the rest. */
  body.typing #stage { position: relative; inset: auto; order: -1; flex: none; z-index: 2;
    width: min(820px, 100%); padding: 0;
    --stageW: min(820px, calc(100vw - 32px)); --stageH: calc((100dvh - var(--kb, 0px)) * .42); }
  body.typing #stage iframe { width: var(--stageW); height: var(--stageH); }
  body.typing.staged #transcript { position: relative; inset: auto; margin-inline: 0;
    max-height: none; padding: 0 4px 8px; z-index: 2; }

  /* Alerts: Jarvis speaking first. Above everything, including an open panel,
     because the settings panel's Test is one of the ways they arrive. */
  #alerts { position: fixed; z-index: 80; top: calc(64px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
    display: grid; gap: 8px; pointer-events: none; }
  #alerts .alert { pointer-events: auto; background: var(--surface); border: 1px solid var(--hair);
    border-left: 3px solid var(--accent); border-radius: 10px; padding: 10px 12px;
    box-shadow: var(--shadow); animation: alertIn .25s ease-out; }
  #alerts .alert.urgent { border-left-color: var(--danger); }
  #alerts .ahead { display: flex; align-items: center; gap: 10px; }
  #alerts .ahead b { font-weight: 600; font-size: 14px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #alerts .ahead span { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  #alerts .ahead button { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; min-width: 40px; min-height: 36px; font: 14px inherit; cursor: pointer; }
  #alerts .alert.unplayed .hear { border-color: var(--accent); color: var(--accent-ink); }
  #alerts .atext { margin-top: 6px; font-size: 15px; color: var(--fg); white-space: pre-wrap;
    overflow-wrap: anywhere; max-height: 30vh; overflow-y: auto; }
  @keyframes alertIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  /* Settings → Alerts: this device, and where alerts have gone. */
  .panel .alertbox { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--tile); }
  .panel .alertbox h4 { margin: 4px 0 0; font-size: 13px; font-weight: 500; color: var(--dim); }
  .panel .alertbox ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .panel .alertbox li { display: flex; gap: 10px; align-items: baseline; justify-content: space-between;
    font-size: 13px; color: var(--fg); flex-wrap: wrap; }
  .panel .alertbox li small { color: var(--dim); }
  .panel .alertbox li.empty { color: var(--dim); }
  .panel .alertbox .thisdev { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }

  /* Settings, Family and Memory (src/app/ui/sections.ts): a menu of
     sections, one open at a time, instead of every section one after another
     down a very long sheet. */
  .panel .sheet.setsheet { width: min(1040px, 100%); }
  .panel .setwrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px;
    align-items: start; margin-top: 12px; }
  .panel .setnav { display: grid; gap: 4px; position: sticky; top: 0; }
  .panel .setnav h4 { margin: 14px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); }
  .panel .setnav h4:first-child { margin-top: 0; }
  .panel .setnav button { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px;
    padding: 10px 12px; min-height: 46px; font: inherit; font-size: 14px; color: var(--fg); cursor: pointer; }
  .panel .setnav button:hover { background: var(--wash); }
  .panel .setnav button.on { background: var(--surface-2); border-color: var(--line); color: var(--fg); }
  .panel .setnav .st { font-size: 13px; font-weight: 700; flex: none; }
  .panel .setnav .st.on { color: var(--ok); }
  .panel .setnav .st.need { color: var(--danger); }
  .panel .setnav .st.off { color: var(--faint); }
  .panel .setnav .st.aside { color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
  .panel .setnav .navnote { font-size: 12px; color: var(--dim); margin: 14px 10px 0; line-height: 1.45; }
  .panel .setnav .navver { font-size: 12px; color: var(--faint); margin: 10px 10px 0; font-variant-numeric: tabular-nums; }
  .panel .setnav .navver:empty { display: none; }
  .panel .setnav .navver.update { color: var(--fg); }
  .panel .setnav .navver a { color: var(--accent-ink); }
  /* Settings → Usage and cost. */
  .panel .usagenow { gap: 8px; }
  .panel .usagenow h4 { margin: 10px 0 0; font-size: 13px; font-weight: 500; color: var(--fg); }
  .panel .usagenow ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
  .panel .setbody [data-section]:not(.active) { display: none; }
  .panel .setbody .svc h4 { margin: 6px 0 0; font-size: 13px; font-weight: 500; color: var(--dim); }
  .panel .setbody .svc.active { margin-top: 0; }
  .panel .setsheet .back { display: none; }
  /* Narrow — a phone, the car's driving layout: the list, then one section in its place. */
  @media (max-width: 860px) {
    .panel .setwrap { grid-template-columns: minmax(0, 1fr); }
    .panel .setnav { position: static; }
    .panel .setsheet:not(.detail) .setbody { display: none; }
    .panel .setsheet.detail .setnav { display: none; }
    .panel .setsheet.detail .back { display: inline-flex; }
    .panel .setsheet.detail h2 { display: none; }
  }

  /* Routines. */
  .panel .rlist { display: grid; gap: 10px; margin-top: 12px; }
  .panel .routine { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--tile); }
  .panel .routine.off { opacity: .6; }
  .panel .routine .rtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .panel .routine .rtop b { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .panel .routine .rwhen { font-size: 13px; color: var(--fg); overflow-wrap: anywhere; }
  .panel .routine .rfacts { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
  .panel .routine .rfacts.bad { color: var(--danger); }
  .panel .rform { display: grid; gap: 8px; margin-top: 10px; }
  .panel .rform input:not([type=checkbox]), .panel .rform textarea {
    background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: inherit; font-size: 14px; width: 100%; }
  .panel .rform .rdays { display: flex; flex-wrap: wrap; gap: 10px; }
  .panel .rform input[type=number] { width: 90px; }
  .panel .jobresult { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 8px; }
  .panel .jobtext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.5; color: var(--fg); }
  .panel .jobtext a { color: var(--accent-ink); }
  .panel .jobresult details summary { cursor: pointer; font-size: 12px; color: var(--dim); }
  .panel .hookhelp { margin-top: 18px; font-size: 13px; color: var(--dim); }
  .panel .hookhelp summary { cursor: pointer; }
  .panel .hookhelp pre { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }

  /* Theme (src/app/ui/ThemePanel.ts): one choice of four, a ring marking it. */
  .panel .navcard { display: grid; gap: 6px; margin-top: 12px; }
  .panel .navcard [role=radio] { display: grid; grid-template-columns: minmax(0, 1fr) 22px; align-items: center;
    column-gap: 12px; row-gap: 2px; text-align: left; padding: 12px 16px; min-height: 56px; font-size: 16px; }
  .panel .navcard [role=radio] > * { grid-column: 1; }
  .panel .navcard [role=radio] small { color: var(--dim); font-size: 13px; }
  .panel .navcard [role=radio]::after { content: ""; grid-column: 2; grid-row: 1 / span 2; width: 22px; height: 22px;
    border-radius: 50%; border: 2px solid var(--faint); }
  .panel .navcard [role=radio][aria-checked="true"]::after { border: 7px solid var(--accent); }
</style>
</head>
<body>
  <h1 id="title">JARVIS</h1>
  <button id="menuBtn" type="button" aria-label="Menu" aria-haspopup="dialog" aria-expanded="false"></button>
  <div id="hub" role="dialog" aria-modal="true" aria-label="Menu">
    <header class="hubhead">
      <span id="hubAvatar" class="avatar" aria-hidden="true"></span><b id="hubName">Jarvis</b>
      <button id="hubClose" type="button" aria-label="Close"></button>
    </header>
    <div id="topbtns" role="menu" aria-label="Menu">
      <!-- data-need: what a family member must be allowed for the item to be offered (main.ts). -->
      <div class="hubgroup" role="group">
        <button id="openMemory" type="button" role="menuitem" data-need="memory.read">Memory</button>
        <button id="openRoutines" type="button" role="menuitem" data-need="routines">Routines</button>
        <button id="openJobs" type="button" role="menuitem" data-need="ask">Jobs</button>
      </div>
      <div class="hubgroup" role="group">
        <button id="openChat" type="button" role="menuitem" data-need="chat" hidden>Messages</button>
        <button id="openFamily" type="button" role="menuitem">Family</button>
      </div>
      <div class="hubgroup" role="group">
        <button id="openDevices" type="button" role="menuitem" data-need="ask">Devices</button>
        <button id="openSettings" type="button" role="menuitem" data-need="admin">Settings</button>
      </div>
      <div class="hubgroup" role="group">
        <button id="openTheme" type="button" role="menuitem">Theme</button>
        <button id="toggleLog" type="button" role="menuitem">Events</button>
      </div>
    </div>
  </div>

  <div id="tabs" role="group" aria-label="View">
    <span class="pill" aria-hidden="true"></span>
    <button type="button" data-tab="jarvis" aria-pressed="true">Jarvis</button>
    <button type="button" data-tab="chat" aria-pressed="false">Chat</button>
  </div>

  <div id="orbWrap">
    <canvas id="orbCanvas" aria-hidden="true"></canvas>
    <button id="orb" class="orb" aria-label="Start or stop Jarvis"></button>
  </div>
  <div id="status">loading…</div>
  <div id="hint"></div>
  <div id="talkrow">
    <div id="modes" role="group" aria-label="How to talk">
      <button type="button" data-mode="live">Live</button>
      <button type="button" data-mode="ptt">Push-to-talk</button>
    </div>
  </div>
  <div id="transcript"></div>
  <form id="typebar" autocomplete="off">
    <textarea id="typed" rows="1" placeholder="Message Jarvis…" aria-label="Message Jarvis" enterkeyhint="send"></textarea>
    <button id="askAloud" type="button" title="Ask aloud" aria-label="Ask aloud"></button>
    <button id="readAloud" type="button" aria-pressed="false" title="Read replies aloud" aria-label="Read replies aloud"></button>
    <button id="send" type="submit" aria-label="Send"></button>
  </form>

  <div id="unlock">
    <h2 id="unlockName" style="margin:0;font-weight:300;letter-spacing:8px;font-size:22px">JARVIS</h2>

    <!-- Signing in as yourself: a passkey here, or this screen paired with your phone. -->
    <div id="signIn" class="uview">
      <p>Sign in once on this screen.</p>
      <button id="passkeyGo" class="big">Sign in with a passkey</button>
      <button id="pairGo" class="big alt">Pair with my phone</button>
      <button id="signInBack" class="big alt" hidden>Back</button>
    </div>

    <!-- A screen several people share: who is using it now (src/app/people.ts). -->
    <div id="peopleView" class="uview" hidden>
      <p id="peopleText">Who's using Jarvis?</p>
      <div id="peopleList" class="people"></div>
      <button id="peopleAdd" class="big alt">Add someone</button>
      <button id="peopleBack" class="big alt" hidden>Back</button>
    </div>

    <!-- Their PIN, to switch into someone who has one. -->
    <div id="pinView" class="uview" hidden>
      <p id="pinText"></p>
      <input id="pinInput" class="field" type="password" inputmode="numeric" pattern="[0-9]*"
             maxlength="8" autocomplete="off" placeholder="PIN">
      <button id="pinGo" class="big">Unlock</button>
      <button id="pinBack" class="big alt">Back</button>
    </div>

    <!-- A code for a signed-in phone to approve: Family → Sign in another screen. -->
    <div id="pairView" class="uview" hidden>
      <p>On your phone, open Jarvis → <b>Family</b> → <b>Sign in another screen</b>, and enter</p>
      <div id="pairCode" class="paircode">······</div>
      <p id="pairLeft" class="dim"></p>
      <button id="pairCancel" class="big alt">Cancel</button>
    </div>

    <!-- Opened from an invite link. -->
    <div id="joinView" class="uview" hidden>
      <p id="joinText"></p>
      <input id="joinName" class="field" autocomplete="name" maxlength="40" placeholder="Your name">
      <button id="joinGo" class="big">Create my passkey</button>
      <p class="dim">Face ID, a fingerprint or your phone's PIN. No password.</p>
    </div>

    <!-- The deployment's owner key: how a Jarvis without a family is used, and the way back in. -->
    <details id="keyWrap" class="uview">
      <summary>Use the owner key</summary>
      <input id="keyInput" autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false" inputmode="latin"
             maxlength="24" placeholder="XXXXXXXXXXXXXXXX">
      <button id="keyGo">Unlock</button>
    </details>
    <div id="keyErr"></div>
  </div>

  <div id="alerts" aria-live="polite"></div>
  <div id="logWrap"><div id="log"></div></div>
  <audio id="remote" autoplay playsinline></audio>

  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
