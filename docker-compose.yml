# docker compose up -d                   Jarvis on http://localhost:8787
# docker compose --profile https up -d   plus automatic HTTPS for JARVIS_DOMAIN
#
# Put JARVIS_SHARED_SECRET (and, for https, JARVIS_DOMAIN) in a .env file next
# to this one. Browsers only allow the microphone over HTTPS — or on localhost —
# so anything beyond this machine needs the https profile, or a tunnel such as
# Cloudflare Tunnel or Tailscale in front.
services:
  jarvis:
    build: .
    image: jarvis-voice-agent
    restart: unless-stopped
    environment:
      JARVIS_SHARED_SECRET: ${JARVIS_SHARED_SECRET:?set JARVIS_SHARED_SECRET in .env}
      # Behind the https profile, Google and Spotify sign-in must return to the
      # public address, not the proxy's plain http hop.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Only while moving this Jarvis elsewhere (README: Moving Jarvis).
      # With the browser profile below: http://127.0.0.1:9222 (or set it in the settings panel).
      BROWSER_URL: ${BROWSER_URL:-}
      MOVE_KEY: ${MOVE_KEY:-}
      JARVIS_STANDBY: ${JARVIS_STANDBY:-}
    ports:
      - "${JARVIS_PORT:-8787}:8787"
    volumes:
      - jarvis-data:/data

  # A full browser for Jarvis to drive, and for a person to take over when a
  # page asks for one: `--profile browser`. It lives inside Jarvis's own network
  # (network_mode), so Jarvis reaches it on 127.0.0.1 (the browser's debugging
  # port 9222, its screen on 3000) and nothing else can: none of its ports is
  # published. Anyone who reached that screen would be signed in as the family.
  browser:
    image: lscr.io/linuxserver/chromium:latest
    profiles: ["browser"]
    restart: unless-stopped
    depends_on: [jarvis]
    network_mode: "service:jarvis"
    environment:
      TZ: ${TIMEZONE:-Etc/UTC}
      # The profile stays where the image keeps it: there the image clears the lock a
      # replaced container leaves behind. Anywhere else, the browser starts into "the
      # profile is in use by another computer" and never opens its debugging port.
      CHROME_CLI: --remote-debugging-port=9222
      # No terminal, no sudo, no closing the browser from its screen.
      HARDEN_DESKTOP: "true"
      HARDEN_OPENBOX: "true"
      TITLE: Jarvis browser
    volumes:
      - browser-data:/config
    # Chrome keeps page memory in /dev/shm; the default 64 MB crashes modern sites.
    shm_size: "1gb"
    mem_limit: 2g

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [jarvis]
    environment:
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  jarvis-data:
  browser-data:
  caddy-data:
