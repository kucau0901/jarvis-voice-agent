<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#05070b">
<meta name="description" content="Voice agent for the car, the house, and whatever else is wired up.">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<!-- iOS ignores the manifest for home-screen launches and wants these instead. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* Force dark: Chromium 148 in the car can report prefers-color-scheme: light,
     and this is a screen used at night. */
  :root {
    color-scheme: dark;
    --bg: #05070b; --fg: #e8edf5; --dim: #6c7889;
    --cyan: #4fd1e0; --gold: #ffc65c; --red: #ff7b81;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    overscroll-behavior: none;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  /* dvh, because a phone's toolbar collapses and 100% then crops the orb.
     Harmless in the car, which has no such toolbar. */
  body { height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 22px; padding: 20px; }

  h1 { position: fixed; top: 18px; left: 22px; margin: 0; font-size: 15px;
    font-weight: 400; letter-spacing: 6px; color: var(--dim); }

  /* The orb is the only control, and it is used while driving: the hit area is
     sized generously and explicitly, because this browser now reports
     pointer:fine and anything sized off pointer:coarse would silently shrink. */
  /* The orb is a WebGL canvas. The tap target is a separate, deliberately
     oversized element over it: this browser reports pointer:fine, so nothing
     gets touch-friendly sizing for free, and it is pressed while driving. */
  #orbWrap { position: relative; width: min(38vh, 300px); aspect-ratio: 1;
    flex: none; display: grid; place-items: center; margin: 2vh 0 3vh;
    transition: width .55s cubic-bezier(.22,.9,.28,1),
                margin .55s cubic-bezier(.22,.9,.28,1),
                transform .55s cubic-bezier(.22,.9,.28,1); }

  /* When something is on screen the orb steps aside: smaller, pinned top-left,
     still animating so it is clearly alive and still the thing you tap.

     Sized against the SMALLER viewport dimension, because the Tesla gives this
     app two very different shapes: the whole screen when parked, and a narrow
     column beside the driving visualisation when moving. Everything here scales
     rather than switching at a breakpoint, so it also survives Tesla changing
     that split. --orb is the one number the rest follows. */
  body.staged { justify-content: flex-start; padding-top: 8px;
    --orb: clamp(56px, 11vmin, 96px); }
  body.staged #orbWrap { position: fixed; top: 10px; left: 12px; z-index: 61;
    width: var(--orb); margin: 0; }
  /* The canvas is inset -22%, so the orb DRAWS 1.44x its layout box and its glow
     reaches further still. Offsetting by --orb alone put the text inside that
     halo. Everything to the right of the orb is positioned from --orbSpan. */
  body.staged { --orbSpan: calc(var(--orb) * 1.44); }
  body.staged #status, body.staged #hint { position: fixed;
    left: calc(var(--orbSpan) + 18px); z-index: 61; text-align: left;
    font-size: clamp(12px, 1.6vmin, 15px);
    max-width: calc(100vw - var(--orbSpan) - 230px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.staged #status { top: calc(10px + var(--orb) / 2 - 12px); }
  body.staged #hint { top: calc(10px + var(--orb) / 2 + 8px); font-size: 11px; }
  /* Centred under the picture on a wide screen, rather than pinned left. */
  body.staged #transcript { position: fixed; left: 0; right: 0; margin-inline: auto; bottom: 6px;
    max-height: 16vh; z-index: 61; padding: 0 14px; }
  body.staged #transcript .row { font-size: clamp(12px, 1.7vmin, 15px); }

  /* A narrow viewport is the driving split. Give the picture the room. */
  @media (max-width: 900px) {
    body.staged #transcript { max-height: 13vh; }
    body.staged .row .who { width: 40px; font-size: 10px; }
  }
  /* One row that lays itself out, rather than three fixed offsets that collide
     the moment the viewport is a phone rather than a dashboard. */
  /* One button in the corner, not a row of six: the row wrapped over the orb
     in the car's narrow driving layout. Its list opens underneath it. */
  #menuBtn { position: fixed; z-index: 62; top: calc(12px + env(safe-area-inset-top));
    right: calc(14px + env(safe-area-inset-right)); width: 52px; height: 52px;
    border-radius: 14px; background: #131b26; color: var(--fg); border: 1px solid #1e2937;
    font-size: 22px; line-height: 1; cursor: pointer; }
  #menuBtn[aria-expanded="true"] { border-color: var(--cyan); }
  #topbtns { position: fixed; z-index: 63; display: none; flex-direction: column; gap: 6px;
    top: calc(72px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right));
    min-width: 210px; padding: 8px; border-radius: 14px; background: #0e1520;
    border: 1px solid #1e2937; box-shadow: 0 18px 50px rgba(0,0,0,.55); }
  #topbtns.open { display: flex; }
  #topbtns button { background: #131b26; color: var(--fg); border: 1px solid #1e2937;
    border-radius: 10px; padding: 12px 16px; min-height: 52px; font: inherit; font-size: 16px;
    text-align: left; cursor: pointer; white-space: nowrap; }

  /* Focus: while talking to Jarvis, everything but the orb, the status and the
     words fades away. A tap on empty space brings it back for a few seconds. */
  h1, #menuBtn, #talkrow { transition: opacity .35s ease; }
  body.focus:not(.peek) h1,
  body.focus:not(.peek) #menuBtn,
  body.focus:not(.peek) #talkrow { opacity: 0; pointer-events: none; }

  #orbCanvas { position: absolute; inset: -22%; width: 144%; height: 144%;
    display: block; pointer-events: none; }
  #orb { position: absolute; inset: 0; border-radius: 50%; cursor: pointer;
    background: transparent; border: 0; -webkit-appearance: none; appearance: none; }
  #orb:focus-visible { outline: 2px solid var(--cyan); outline-offset: 6px; }
  #orb.connecting, #orb.reconnecting { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .9 } 50% { opacity: 1 } }
  /* Fallback if WebGL is unavailable: the app must still be usable. */
  #orbWrap.nogl #orb { background: radial-gradient(circle at 50% 45%, #16323c 0%, #0a1620 60%, #070d14 100%);
    box-shadow: 0 0 0 1px #1d3644 inset, 0 0 70px -14px var(--cyan); }

  #status, #hint, #transcript { position: relative; z-index: 2; }
  #status { font-size: 17px; color: var(--dim); text-align: center; min-height: 24px; }
  #status.bad { color: var(--red); }
  #hint { font-size: 12px; color: #48525f; min-height: 16px; font-variant-numeric: tabular-nums; }

  #transcript { width: min(760px, 100%); max-height: 26vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; padding: 0 4px; }
  .row { display: flex; gap: 10px; font-size: 15px; line-height: 1.45; }
  .row .who { flex: none; width: 52px; font-size: 11px; letter-spacing: .5px;
    text-transform: uppercase; padding-top: 3px; }
  .row.you .who { color: var(--cyan); } .row.jarvis .who { color: var(--gold); }
  .row .txt { color: #cbd5e3; }

  #logWrap { position: fixed; inset: auto 0 0 0; height: 0; overflow: hidden;
    background: #070b11; border-top: 1px solid #16202c; transition: height .2s ease; }
  #logWrap.open { height: 42vh; }
  #log { height: 100%; overflow-y: auto; padding: 10px 14px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ln { display: flex; gap: 10px; border-bottom: 1px solid #0e151d; padding: 2px 0; }
  .ln .t { flex: none; width: 250px; color: var(--cyan); }
  .ln .t.e { color: var(--red); }
  .ln .j { color: #5d6b7d; word-break: break-all; }

  /* The sheets: settings, devices and memory. Both are phone-or-laptop jobs rather than
     driving ones — each means typing something the Tesla keyboard makes
     miserable. One shared class, because two id selectors per rule is how you
     end up with `#settings, #devices .sheet` styling the whole overlay. */
  .panel { position: fixed; inset: 0; background: rgba(3,5,9,.82); z-index: 60;
    display: none; align-items: center; justify-content: center; padding: 20px; }
  .panel.open { display: flex; }
  .panel .sheet { width: min(760px, 100%); max-height: 86dvh; overflow-y: auto;
    background: #0a0f16; border: 1px solid #1b2634; border-radius: 14px; padding: 20px; }
  .panel header { display: flex; align-items: center; justify-content: space-between; }
  .panel h2 { margin: 0; font-size: 18px; font-weight: 500; }
  .panel .note { color: var(--dim); font-size: 13px; margin: 6px 0 16px; }
  .panel .note:empty { display: none; }
  .panel code { background: #141d28; padding: 1px 5px; border-radius: 4px; }
  .panel .srv { display: grid; gap: 8px; padding: 12px; margin-bottom: 10px;
    border: 1px solid #16202c; border-radius: 10px; background: #070b11; }
  .panel input[type=text], .panel .srv input:not([type=checkbox]) {
    background: #0e151d; color: var(--fg); border: 1px solid #1d2835;
    border-radius: 8px; padding: 11px 12px; font: 16px inherit; min-height: 44px; width: 100%; }
  .panel .on { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .panel .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .panel button { background: #1a242f; color: var(--fg); border: 1px solid #243140;
    border-radius: 8px; padding: 10px 16px; min-height: 44px; font: 14px inherit; cursor: pointer; }
  .panel button.primary { background: var(--cyan); color: #05070b; border-color: var(--cyan); font-weight: 600; }
  .panel .actions { display: flex; gap: 10px; margin-top: 8px; }
  .panel .res, .panel .msg { font: 12px/1.5 ui-monospace, Menlo, monospace;
    color: #5d6b7d; word-break: break-word; margin-top: 8px; }
  .panel .res.bad, .panel .msg.bad { color: var(--red); }
  .panel h3 { margin: 22px 0 0; font-size: 14px; font-weight: 500; color: var(--fg); }
  .panel .router { display: grid; gap: 10px; padding: 14px; margin-top: 14px;
    border: 1px solid #16202c; border-radius: 10px; background: #070b11; }
  .panel .router h3 { margin: 0; }
  .panel .router .note { margin: 0; }
  .panel .now { font-size: 14px; color: var(--dim); display: grid; gap: 6px; }
  .panel .now b { color: var(--fg); font-weight: 600; }
  .panel .warn { color: var(--red); font-size: 13px; line-height: 1.45; }
  /* 16px so iOS and Android do not zoom the page when it takes focus. */
  .panel select { background: #0e151d; color: var(--fg); border: 1px solid #1d2835;
    border-radius: 8px; padding: 11px 12px; font: 16px inherit; min-height: 44px; width: 100%; }
  .panel button:disabled, .panel select:disabled { opacity: .45; cursor: default; }

  /* Every setting (src/app/ui/Services.ts). Secrets are never on this page —
     only a fingerprint — so a field is blank until a replacement is typed. */
  .panel .svc { display: grid; gap: 10px; padding: 14px; margin-top: 14px;
    border: 1px solid #16202c; border-radius: 10px; background: #070b11; }
  /* One column that may shrink below its content: without minmax(0, …) a long
     unbreakable value (a redirect URI) sets the width of the whole section and
     pushes it past the edge of a phone screen. */
  .panel .svc { grid-template-columns: minmax(0, 1fr); }
  .panel .note code { overflow-wrap: anywhere; }
  .panel .inforce { font-size: 14px; color: var(--dim); }
  .panel .inforce b { color: var(--fg); font-weight: 600; }
  .panel .svc h3 { margin: 0; }
  .panel .svc .note { margin: 0; }
  .panel .svchead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .panel .chip { font-size: 11px; letter-spacing: .3px; padding: 3px 8px; border-radius: 999px;
    border: 1px solid #243140; color: var(--dim); white-space: nowrap; }
  .panel .chip.on { color: #4ade80; border-color: #1f4d33; }
  .panel .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel .check { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .panel .check.on { color: #4ade80; border-color: #1f4d33; }
  .panel .check.need { color: var(--red); border-color: #5a2323; }
  .panel .field { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid #111a24; }
  .panel .fieldtop { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .panel .fieldtop label { font-size: 14px; color: var(--fg); }
  .panel .badge { font-size: 11px; color: #5d6b7d; white-space: nowrap; }
  .panel .badge.saved { color: var(--cyan); }
  .panel .badge.unset { color: #7a5a2a; }
  .panel .current { font: 13px/1.4 ui-monospace, Menlo, monospace; color: #cbd5e3; word-break: break-all; }
  .panel .current.secret { color: #8b98aa; letter-spacing: .3px; }
  .panel .fieldfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .panel .fieldfoot .help { font-size: 12px; color: #5d6b7d; }
  .panel .fieldfoot button { min-height: 34px; padding: 4px 12px; font-size: 13px; }
  .panel .cmd { display: block; padding: 8px 10px; font-size: 13px; overflow-x: auto; white-space: nowrap; }
  .panel .svc input:not([type=checkbox]) {
    background: #0e151d; color: var(--fg); border: 1px solid #1d2835;
    border-radius: 8px; padding: 11px 12px; font: 16px inherit; min-height: 44px; width: 100%; }

  /* Devices. Minting a credential is a phone-or-laptop job, never a driving one. */
  #devices .mint { display: grid; gap: 10px; padding: 14px; margin-bottom: 14px;
    border: 1px solid #16202c; border-radius: 10px; background: #070b11; }
  #devices .scopes { display: grid; gap: 6px; }
  #devices .scope { display: flex; align-items: flex-start; gap: 9px; font-size: 13px;
    color: var(--dim); cursor: pointer; }
  #devices .scope input { margin-top: 3px; min-width: 18px; min-height: 18px; }
  #devices .scope.wild { color: var(--fg); padding-bottom: 6px; border-bottom: 1px solid #16202c; }
  #devices .dev { display: grid; gap: 8px; padding: 12px; margin-bottom: 10px;
    border: 1px solid #16202c; border-radius: 10px; background: #070b11; }
  #devices .dev.dead { opacity: .5; }
  #devices .who { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  #devices .dim { color: #5d6b7d; font-size: 12px; }
  #devices .grants { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  #devices button.armed { background: var(--red); border-color: var(--red);
    color: #fff; font-weight: 600; }
  /* The one moment the token is readable, so it gets the loudest box here. */
  #devices .token { border: 1px solid var(--cyan); border-radius: 10px;
    padding: 16px; margin-bottom: 16px; background: #071018; }
  #devices .token p { color: var(--dim); font-size: 13px; margin: 8px 0; }
  #devices .tok { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #devices .tok code { font: 13px ui-monospace, Menlo, monospace; word-break: break-all;
    flex: 1 1 260px; padding: 10px; }
  #devices .qr { background: #fff; padding: 10px; border-radius: 8px;
    width: max-content; margin: 12px 0; }
  #devices .qr svg { display: block; width: 190px; height: 190px; }
  /* Memory (src/app/ui/Memory.ts): every fact Jarvis carries, and a way to add or forget one. */
  #memory [hidden] { display: none !important; }
  #memory .gauge { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; gap: 10px;
    align-items: center; font-size: 13px; color: var(--dim); }
  #memory .bar { height: 6px; border-radius: 3px; background: #141d28; overflow: hidden; }
  #memory .bar i { display: block; height: 100%; width: 0; background: var(--cyan); }
  #memory .bar.full i { background: #e0a43a; }
  #memory details summary { cursor: pointer; font-size: 13px; color: var(--dim); padding: 10px 0; }
  #memory .profile pre { white-space: pre-wrap; word-break: break-word; margin: 0;
    font: 12px/1.5 ui-monospace, Menlo, monospace; color: #cbd5e3; background: #070b11;
    border: 1px solid #16202c; border-radius: 10px; padding: 12px; }
  #memory .add { display: grid; gap: 10px; padding: 14px; margin: 14px 0;
    border: 1px solid #16202c; border-radius: 10px; background: #070b11; }
  #memory .addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  #memory .fpin input { min-width: 18px; min-height: 18px; }
  #memory .named { display: grid; gap: 10px; }
  #memory .find { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  #memory .list h3, #memory .ref summary { margin: 22px 0 8px; font-size: 14px; font-weight: 500; color: var(--fg); }
  #memory .fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px;
    align-items: center; padding: 12px; margin-bottom: 8px;
    border: 1px solid #16202c; border-radius: 10px; background: #070b11; }
  #memory .ftxt { font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
  #memory .meta { grid-column: 1; font-size: 12px; color: #5d6b7d; overflow-wrap: anywhere; }
  #memory .forget { grid-column: 2; grid-row: 1 / span 2; }
  #memory .pin { color: var(--cyan); }
  #memory .dim { color: #5d6b7d; font-size: 12px; }
  #memory .gone { font-size: 13px; color: var(--dim); padding: 6px 0; border-top: 1px solid #111a24; }
  #memory button.armed { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  @media (max-width: 520px) {
    #memory .gauge { grid-template-columns: minmax(0, 1fr); }
  }

  /* The stage: a map or a street-level photo, filling the main view. */
  #stage { position: fixed; inset: 0; display: none; align-items: center;
    justify-content: center; z-index: 55; pointer-events: none;
    /* Clears the orb row above and the transcript below, at any size. */
    padding: calc(var(--orbSpan, 138px) + 14px) 12px 19vh; }
  #stage.open { display: flex; }
  #stage .frame { position: relative; max-width: 100%; max-height: 100%;
    border-radius: 14px; overflow: hidden; border: 1px solid #1b2634;
    background: #070b11; box-shadow: 0 24px 80px -30px #000;
    pointer-events: auto;
    animation: stageIn .45s cubic-bezier(.22,.9,.28,1) both; }
  /* The static image is 1280x800 (640x400 at scale 2). Letting it fill a wide
     viewport upscales past its own resolution and looks soft, so cap it at
     roughly its natural size and let the panel shrink around it instead.
     Sized against the VIEWPORT, not the panel: a percentage here refers back to
     the panel, which sizes itself from the image, so the browser cannot shrink
     the panel to fit — a 1920px camera frame left the panel full width with the
     picture in its left half. --stageH is the height left between the orb row
     and the transcript (the padding on #stage). */
  #stage { --stageW: calc(100vw - 24px);
    --stageH: calc(100dvh - var(--orbSpan, 138px) - 14px - 19vh); }
  #stage img { display: block; width: auto; height: auto;
    max-width: min(var(--stageW), 980px); max-height: var(--stageH);
    object-fit: contain; background: #0a0f16; }
  /* A camera frame is full HD, and seeing it large is the point. */
  #stage .frame.camera img { max-width: min(var(--stageW), 1600px); }
  #stage iframe { display: block; border: 0; background: #0a0f16;
    width: min(1000px, 92vw); height: min(560px, 58vh); }
  #stage .frame { width: auto; }
  #stage .cap { position: absolute; left: 0; right: 0; bottom: 0;
    padding: 26px 16px 12px; font-size: 15px; color: #e8edf5;
    background: linear-gradient(transparent, rgba(3,5,9,.92)); }
  /* Sized to be hit without aiming. Jarvis can also close it by voice, which is
     the intended way while moving — this is the fallback, not the mechanism. */
  #stage .close { position: absolute; top: 8px; right: 8px;
    min-height: 56px; min-width: 88px; padding: 12px 20px; border-radius: 10px;
    border: 1px solid #2c3a49; background: rgba(10,15,22,.9); color: var(--fg);
    font: 600 15px inherit; cursor: pointer; }
  @keyframes stageIn { from { opacity: 0; transform: translateY(16px) scale(.97) }
                       to   { opacity: 1; transform: none } }


  /* Unlock screen. Everything here is oversized on purpose: it is used at arm's
     length on a dashboard, and this browser reports pointer:fine so nothing
     gets touch sizing for free. */
  #unlock { position: fixed; inset: 0; background: var(--bg); z-index: 50;
    display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px; }
  #unlock.show { display: flex; }
  #unlock p { color: var(--dim); margin: 0; text-align: center; font-size: 15px; }
  #keyInput { width: min(460px, 100%); height: 68px; text-align: center;
    background: #0c1218; color: var(--fg); border: 1px solid #22303f;
    border-radius: 12px; font: 600 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 3px; text-transform: uppercase; }
  #keyInput:focus { outline: none; border-color: var(--cyan); }
  #keyGo { width: min(460px, 100%); height: 64px; background: var(--cyan);
    color: #05070b; border: 0; border-radius: 12px; font: 600 19px inherit; cursor: pointer; }
  #keyGo:disabled { opacity: .35; }
  #keyErr { color: var(--red); font-size: 14px; min-height: 20px; }

  /* Viewport overrides last: these carry no extra specificity, so they only
     win by coming after the rules they override. */
  /* A phone. Narrow AND tall — where the Tesla's driving split is narrow and
     wide — so this keys on orientation as well as width, and both of the car's
     layouts are left exactly as they were. */
  @media (max-width: 620px) and (orientation: portrait) {
    h1 { top: calc(12px + env(safe-area-inset-top));
         left: calc(16px + env(safe-area-inset-left));
         font-size: 13px; letter-spacing: 4px; }
    /* Room for the menu button above and the home indicator below. */
    body { gap: 16px;
           padding: 74px 16px calc(20px + env(safe-area-inset-bottom)); }
    #orbWrap { --w: min(60vw, 40vh); width: var(--w);
      margin: 0 0 calc(var(--w) * 0.2); }
    #status { font-size: 16px; }
    #transcript { max-height: 22dvh; }
    /* A sheet rises from the bottom, which is where a thumb already is. */
    .panel { padding: 0; align-items: flex-end; }
    .panel .sheet { width: 100%; max-height: 92dvh; border-radius: 16px 16px 0 0;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    #devices .qr svg { width: 150px; height: 150px; }
    #devices .tok code { flex: 1 1 100%; }
  }

  /* A desktop window has room the dashboard does not. */
  @media (min-width: 1100px) and (min-height: 760px) {
    #orbWrap { width: min(46vh, 380px); }
    #status { font-size: 19px; }
  }

  /* Live or push-to-talk, per screen. Out of the way while a picture is up. */
  #modes { position: relative; z-index: 2; display: flex; gap: 0; border: 1px solid #1e2937;
    border-radius: 999px; overflow: hidden; }
  #modes button { background: transparent; color: var(--dim); border: 0; padding: 10px 16px;
    min-height: 40px; font: inherit; font-size: 13px; cursor: pointer; }
  #modes button.on { background: #16232f; color: var(--fg); }
  body.staged #talkrow { display: none; }
  #talkrow { position: relative; z-index: 2; display: flex; gap: 10px; align-items: center; }

  /* Alerts: Jarvis speaking first. Above everything, including an open panel,
     because the settings panel's Test is one of the ways they arrive. */
  #alerts { position: fixed; z-index: 80; top: calc(64px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
    display: grid; gap: 8px; pointer-events: none; }
  #alerts .alert { pointer-events: auto; background: #0e1822; border: 1px solid #1f3a48;
    border-left: 3px solid var(--cyan); border-radius: 10px; padding: 10px 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45); animation: alertIn .25s ease-out; }
  #alerts .alert.urgent { border-left-color: var(--red); }
  #alerts .ahead { display: flex; align-items: center; gap: 10px; }
  #alerts .ahead b { font-weight: 600; font-size: 14px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #alerts .ahead span { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  #alerts .ahead button { background: #16232f; color: var(--fg); border: 1px solid #243140;
    border-radius: 8px; min-width: 40px; min-height: 36px; font: 14px inherit; cursor: pointer; }
  #alerts .alert.unplayed .hear { border-color: var(--cyan); color: var(--cyan); }
  #alerts .atext { margin-top: 6px; font-size: 15px; color: #cbd5e3; white-space: pre-wrap;
    overflow-wrap: anywhere; max-height: 30vh; overflow-y: auto; }
  @keyframes alertIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  /* Settings → Alerts: this device, and where alerts have gone. */
  .panel .alertbox { display: grid; gap: 10px; padding: 12px; border: 1px solid #1d2835;
    border-radius: 10px; background: #0b1219; }
  .panel .alertbox h4 { margin: 4px 0 0; font-size: 13px; font-weight: 500; color: var(--dim); }
  .panel .alertbox ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .panel .alertbox li { display: flex; gap: 10px; align-items: baseline; justify-content: space-between;
    font-size: 13px; color: #cbd5e3; flex-wrap: wrap; }
  .panel .alertbox li small { color: var(--dim); }
  .panel .alertbox li.empty { color: var(--dim); }
  .panel .alertbox .thisdev { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }

  /* Routines. */
  .panel .rlist { display: grid; gap: 10px; margin-top: 12px; }
  .panel .routine { display: grid; gap: 6px; padding: 12px; border: 1px solid #1d2835; border-radius: 10px; background: #0b1219; }
  .panel .routine.off { opacity: .6; }
  .panel .routine .rtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .panel .routine .rtop b { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .panel .routine .rwhen { font-size: 13px; color: #cbd5e3; overflow-wrap: anywhere; }
  .panel .routine .rfacts { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
  .panel .routine .rfacts.bad { color: var(--red); }
  .panel .rform { display: grid; gap: 8px; margin-top: 10px; }
  .panel .rform input:not([type=checkbox]), .panel .rform textarea {
    background: #0e151d; color: var(--fg); border: 1px solid #1d2835; border-radius: 8px;
    padding: 10px 12px; font: inherit; font-size: 14px; width: 100%; }
  .panel .rform .rdays { display: flex; flex-wrap: wrap; gap: 10px; }
  .panel .rform input[type=number] { width: 90px; }
  .panel .jobresult { border-top: 1px solid #1d2835; padding-top: 8px; display: grid; gap: 8px; }
  .panel .jobtext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.5; color: #cbd5e3; }
  .panel .jobtext a { color: var(--cyan); }
  .panel .jobresult details summary { cursor: pointer; font-size: 12px; color: var(--dim); }
  .panel .hookhelp { margin-top: 18px; font-size: 13px; color: var(--dim); }
  .panel .hookhelp summary { cursor: pointer; }
  .panel .hookhelp pre { background: #0e151d; border: 1px solid #1d2835; border-radius: 8px; padding: 10px;
    font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: #cbd5e3; }
</style>
</head>
<body>
  <h1>JARVIS</h1>
  <button id="menuBtn" type="button" aria-label="Menu" aria-haspopup="menu" aria-expanded="false">☰</button>
  <div id="topbtns" role="menu" aria-label="Menu">
    <button id="openMemory" type="button" role="menuitem">Memory</button>
    <button id="openRoutines" type="button" role="menuitem">Routines</button>
    <button id="openJobs" type="button" role="menuitem">Jobs</button>
    <button id="openDevices" type="button" role="menuitem">Devices</button>
    <button id="openSettings" type="button" role="menuitem">Settings</button>
    <button id="toggleLog" type="button" role="menuitem">Events</button>
  </div>

  <div id="orbWrap">
    <canvas id="orbCanvas" aria-hidden="true"></canvas>
    <button id="orb" class="orb" aria-label="Start or stop Jarvis"></button>
  </div>
  <div id="status">loading…</div>
  <div id="hint"></div>
  <div id="talkrow">
    <div id="modes" role="group" aria-label="How to talk">
      <button type="button" data-mode="live">Live</button>
      <button type="button" data-mode="ptt">Push-to-talk</button>
    </div>
  </div>
  <div id="transcript"></div>

  <div id="unlock">
    <h2 style="margin:0;font-weight:300;letter-spacing:8px;font-size:22px">JARVIS</h2>
    <p>Enter your access key.<br>You only need to do this once on this screen.</p>
    <input id="keyInput" autocomplete="off" autocapitalize="characters"
           autocorrect="off" spellcheck="false" inputmode="latin"
           maxlength="24" placeholder="XXXXXXXXXXXXXXXX">
    <button id="keyGo">Unlock</button>
    <div id="keyErr"></div>
  </div>

  <div id="alerts" aria-live="polite"></div>
  <div id="logWrap"><div id="log"></div></div>
  <audio id="remote" autoplay playsinline></audio>

  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
