name: release

# A version tag (made by `npm run release`, docs/RELEASING.md) becomes a GitHub
# release, with its notes from CHANGELOG.md. People watching the repository for
# releases are told, and running copies see it in Settings.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp wrangler.example.jsonc wrangler.jsonc
      - run: npx wrangler types
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: The tag is the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Jarvis $GITHUB_REF_NAME" --notes-file notes.md
