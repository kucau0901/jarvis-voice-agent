<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Jarvis</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="description" content="Voice agent for the car, the house, and whatever else is wired up.">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<!-- iOS ignores the manifest for home-screen launches and wants these instead. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<!-- Paints light before the first frame while the light last shown still holds, so a daytime
     reload does not flash black and a night one does not flash white. It holds no rule of its
     own: src/app/theme.ts works out until when (lightUntil) and corrects it at once. -->
<script>try{if(Date.now()<+(localStorage.getItem("jarvis.lightUntil")||0))document.documentElement.dataset.theme="light"}catch(e){}</script>
<style>
  /* Tesla's own colours (its design system's greys and blue), so the app looks
     at home on the car's screen. Dark here, light below, chosen per screen by
     src/app/theme.ts: Auto by the clock is the default rather than the system
     setting, because Chromium 148 in the car can report prefers-color-scheme:
     light at night. Dark is also what shows before any script has run. */
  :root {
    color-scheme: dark;
    --bg: #000000; --surface: #222222; --surface-2: #393c41;
    --field: rgba(255,255,255,.07); --wash: rgba(255,255,255,.06); --tile: rgba(255,255,255,.06);
    --fg: #eeeeee; --dim: #a2a3a5; --faint: #8e8e8e;
    --line: #444444; --hair: rgba(255,255,255,.08);
    --scrim: rgba(0,0,0,.6); --shadow: 0 12px 40px rgba(0,0,0,.5);
    --accent: #3e6ae1; --accent-ink: #5b84ff; --on-accent: #ffffff;
    --seg-on: #393c41; --chip: rgba(245,245,247,.13);
    --danger: #ed4e3b; --ok: #12bb00; --warn: #fbb01b;
    --bubble: rgba(57,60,65,.92); --bubble-you: rgba(255,255,255,.07);
    /* Glass, as Hark has it: a translucent surface over a blurred page. The
       backdrop is two soft gradients, so the blur has something to show. */
    --glass: rgba(34,34,34,.62); --glass-hi: rgba(34,34,34,.72); --blur: blur(40px) saturate(1.4);
    --solid: #eeeeee; --on-solid: #171a20;
    --backdrop: radial-gradient(120% 90% at 12% -20%, rgba(62,106,225,.22), transparent 55%),
      radial-gradient(100% 80% at 105% 110%, rgba(57,60,65,.55), transparent 60%), #000000;
    --barTop: calc(12px + env(safe-area-inset-top));
  }
  /* On an iPhone's home screen the status bar draws white over the page
     (black-translucent, read once at launch): in light, a dark band under it. */
  :root[data-theme="light"] body::after { content: ""; position: fixed; z-index: 100; top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top); background: var(--fg); pointer-events: none; }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f4f4; --surface: #ffffff; --surface-2: #eeeeee;
    --field: rgba(23,26,32,.05); --wash: rgba(23,26,32,.05); --tile: rgba(23,26,32,.04);
    --fg: #171a20; --dim: #5c5e62; --faint: #8e8e8e;
    --line: #d0d1d2; --hair: rgba(23,26,32,.10);
    --scrim: rgba(244,244,244,.6); --shadow: 0 12px 40px rgba(23,26,32,.12);
    --accent: #3e6ae1; --accent-ink: #3e6ae1; --on-accent: #ffffff;
    --seg-on: #ffffff; --chip: #ffffff;
    --danger: #b74134; --ok: #0b7d26; --warn: #fbb01b;
    --bubble: rgba(255,255,255,.98); --bubble-you: rgba(23,26,32,.07);
    --glass: rgba(255,255,255,.55); --glass-hi: rgba(255,255,255,.668);
    --solid: #171a20; --on-solid: #ffffff;
    --backdrop: radial-gradient(120% 90% at 12% -20%, rgba(62,106,225,.14), transparent 55%),
      radial-gradient(100% 80% at 105% 110%, rgba(208,209,210,.9), transparent 60%), #f4f4f4;
  }

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    overscroll-behavior: none;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  /* dvh, because a phone's toolbar collapses and 100% then crops the orb.
     Harmless in the car, which has no such toolbar. */
  body { height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 22px; padding: calc(var(--barTop) + 56px) 20px 20px;
    background: var(--backdrop); }

  h1 { position: fixed; top: calc(var(--barTop) + 14px); left: 22px; margin: 0; font-size: 15px;
    font-weight: 400; letter-spacing: 6px; color: var(--dim);
    max-width: calc(50vw - 160px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Jarvis | Chat, Hark's pill switcher: the sliding pill marks the one in use.
     Under the sign-in screen (50), over the page; hidden while a picture is up. */
  #tabs { position: fixed; z-index: 49; top: calc(var(--barTop) + 2px); left: 50%; transform: translateX(-50%);
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 999px;
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  #tabs .pill { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 3);
    border-radius: 999px; background: var(--solid); transition: transform .25s cubic-bezier(.22,.9,.28,1); }
  body.typing #tabs .pill { transform: translateX(100%); }
  body.home #tabs .pill { transform: translateX(200%); }
  /* Two tabs where Home is not offered (a guest). */
  #tabs:has(> [data-tab="home"][hidden]) .pill { width: calc((100% - 4px) / 2); }
  #tabs button { position: relative; min-height: 44px; padding: 0 22px; border: 0; background: none;
    font: inherit; font-size: 15px; font-weight: 500; color: var(--fg); opacity: .5; cursor: pointer;
    transition: color .15s, opacity .15s; }
  #tabs button[aria-pressed="true"] { color: var(--on-solid); opacity: 1; }
  body.staged:not(.typing) #tabs { display: none; }

  /* The orb is the only control, and it is used while driving: the hit area is
     sized generously and explicitly, because this browser now reports
     pointer:fine and anything sized off pointer:coarse would silently shrink. */
  /* The orb is a WebGL canvas. The tap target is a separate, deliberately
     oversized element over it: this browser reports pointer:fine, so nothing
     gets touch-friendly sizing for free, and it is pressed while driving. */
  /* Smaller than it was: the dashboard is short, and the conversation needs the room. --ow is its size,
     which the room around it follows (#orbRow). */
  :root { --ow: min(27vh, 260px); }
  #orbWrap { position: relative; width: var(--ow); aspect-ratio: 1;
    flex: none; display: grid; place-items: center; margin: 1vh 0 2vh;
    transition: width .55s cubic-bezier(.22,.9,.28,1),
                margin .55s cubic-bezier(.22,.9,.28,1),
                transform .55s cubic-bezier(.22,.9,.28,1); }

  /* When something is on screen the orb steps aside: smaller, pinned top-left,
     still animating so it is clearly alive and still the thing you tap.

     Sized against the SMALLER viewport dimension, because the Tesla gives this
     app two very different shapes: the whole screen when parked, and a narrow
     column beside the driving visualisation when moving. Everything here scales
     rather than switching at a breakpoint, so it also survives Tesla changing
     that split. --orb is the one number the rest follows. */
  body.staged { justify-content: flex-start; padding-top: 8px;
    --orb: clamp(56px, 11vmin, 96px); }
  body.staged #orbWrap { position: fixed; top: 10px; left: 12px; z-index: 57;
    width: var(--orb); margin: 0; }
  /* The canvas is inset -22%, so the orb DRAWS 1.44x its layout box and its glow
     reaches further still. Offsetting by --orb alone put the text inside that
     halo. Everything to the right of the orb is positioned from --orbSpan. */
  body.staged { --orbSpan: calc(var(--orb) * 1.44); }
  body.staged #status { position: fixed;
    left: calc(var(--orbSpan) + 18px); z-index: 57; text-align: left;
    font-size: clamp(12px, 1.6vmin, 15px);
    max-width: calc(100vw - var(--orbSpan) - 230px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.staged #status { top: calc(10px + var(--orb) / 2 - 12px); }
  /* Centred under the picture on a wide screen, rather than pinned left. */
  body.staged #transcript { position: fixed; left: 0; right: 0; margin-inline: auto; bottom: 6px;
    max-height: 16vh; z-index: 57; padding: 0 14px; }
  body.staged #transcript .row { font-size: clamp(12px, 1.7vmin, 15px); }

  /* A narrow viewport is the driving split. Give the picture the room. */
  @media (max-width: 900px) {
    body.staged #transcript { max-height: 13vh; }
  }
  /* The menu, as Hark's settings page: your initial, top right, opens it full
     screen over the blurred app, its items in cards of rows. One button in the
     corner, not a row of six: a row wrapped over the orb in the car's narrow
     driving layout. Over the picture on the stage (55) and the orb, status and
     words beside it (57), under a panel (60). */
  #menuBtn { position: fixed; z-index: 58; top: var(--barTop); right: calc(14px + env(safe-area-inset-right));
    width: 48px; height: 48px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%;
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    color: var(--fg); font: inherit; font-size: 19px; font-weight: 600; cursor: pointer; }
  #menuBtn:empty::before, #hub .avatar:empty::before { content: ""; width: 22px; height: 22px; background: currentColor;
    -webkit-mask: var(--i-person) center / contain no-repeat; mask: var(--i-person) center / contain no-repeat; }
  #menuBtn.dot::after { content: ""; position: absolute; top: 2px; right: 2px; width: 11px; height: 11px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }
  #hub { position: fixed; inset: 0; z-index: 59; display: none; overflow-y: auto; background: var(--scrim);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    padding: calc(var(--barTop) + 64px) 16px calc(24px + env(safe-area-inset-bottom)); }
  #hub.open { display: block; }
  #hub .hubhead { width: min(560px, 100%); margin: 0 auto 22px; display: flex; align-items: center; gap: 14px; }
  #hub .avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent); font-size: 24px; font-weight: 600; }
  #hub #hubName { font-size: 28px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hubClose { position: fixed; z-index: 59; top: var(--barTop); right: calc(14px + env(safe-area-inset-right)); width: 48px; height: 48px;
    border: 0; border-radius: 50%; background: var(--glass-hi); color: var(--fg); cursor: pointer; display: none; place-items: center; }
  #hub.open + #hubClose { display: grid; }
  #hubClose::before { content: ""; width: 20px; height: 20px; background: currentColor;
    -webkit-mask: var(--i-close) center / contain no-repeat; mask: var(--i-close) center / contain no-repeat; }
  #topbtns { width: min(560px, 100%); margin: 0 auto; display: grid; gap: 14px; }
  #topbtns .hubgroup { display: grid; border-radius: 24px; overflow: hidden; background: var(--glass-hi); }
  #topbtns .hubgroup:not(:has(> button:not([hidden]))) { display: none; }
  #topbtns button[hidden] { display: none !important; }

  /* Messages, the family's chat (src/app/ui/Chat.ts): conversations as rows in
     a card, the conversation as bubbles, and a message box like Chat's. */
  #chat .chatsheet { display: flex; flex-direction: column; padding-inline: max(16px, calc((100% - 960px) / 2)); }
  #chat .chatwrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; flex: 1; min-height: 0; }
  #chat .convos { display: grid; align-content: start; align-self: start; max-height: 100%; overflow-y: auto;
    border-radius: 24px; background: var(--glass-hi); }
  #chat .convo { display: grid; text-align: left; gap: 2px; padding: 12px 20px; min-height: 60px; position: relative;
    border: 0; border-radius: 0; background: transparent; font-size: 15px; }
  #chat .convo + .convo { background: linear-gradient(var(--hair), var(--hair)) 20px 0 / calc(100% - 40px) 1px no-repeat; }
  #chat .convo.on { background-color: var(--wash); }
  #chat .convo small { color: var(--faint); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #chat .unread { position: absolute; top: 12px; right: 14px; background: var(--accent); color: var(--on-accent);
    border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 7px; }
  #chat .thread { display: flex; flex-direction: column; min-height: 0; }
  #chat .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  #chat .cmsg { max-width: 85%; padding: 10px 16px; border-radius: 20px; background: var(--bubble); align-self: flex-start; }
  #chat .cmsg.mine { align-self: flex-end; background: var(--bubble-you); }
  #chat .cmsg.agent { background: var(--bubble); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
  #chat .cwho { font-size: 11px; color: var(--faint); margin-bottom: 2px; }
  #chat .ctext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  #chat .compose { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; margin-top: 10px; padding: 4px;
    border-radius: 26px; background: var(--glass-hi); }
  #chat .compose input { background: transparent; color: var(--fg); border: 0; border-radius: 999px;
    padding: 11px 14px; font-size: 16px; font-family: inherit; min-height: 44px; }
  #chat .back { display: none; }
  .relayacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .relayacts input { flex: 1 1 160px; background: var(--field); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; font: 15px inherit; min-height: 44px; }
  .relayacts button { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; min-height: 44px; font: 14px inherit; cursor: pointer; }
  .relayacts button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .relayerr { color: var(--danger); font-size: 12px; }
  #family .sheet > .msg { margin: 8px 0 0; }
  #family .svchead .m-role { width: auto; min-width: 130px; }
  #family .sheet > .msg:empty, #family .m-res:empty { display: none; }
  #family .limits { display: grid; gap: 8px; margin-top: 8px; }
  #family .limits input[type=date], #family .limits input[type=time], #family .limits .l-pass input {
    background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 15px inherit; }
  #family .m-limits summary, #family .f-ilimits summary, #family .l-typed summary { color: var(--dim); font-size: 13px; cursor: pointer; }
  #family .l-things { display: grid; gap: 4px; max-height: 220px; overflow-y: auto; }
  #family .l-thing small { color: var(--faint); margin-left: 6px; }
  #family .l-filter { background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 15px inherit; }
  .cdone { margin-top: 6px; font-size: 13px; color: var(--ok); }
  .alert .aopen { margin-top: 8px; background: none; border: 0; color: var(--accent-ink); font: 13px inherit; cursor: pointer; padding: 0; }
  @media (max-width: 620px) {
    #chat .chatwrap { grid-template-columns: minmax(0, 1fr); }
    #chat .sheet:not(.detail) .thread { display: none; }
    #chat .sheet.detail .convos { display: none; }
    #chat .sheet.detail .back { display: grid; }
  }
  /* A row: its icon, its name, a chevron; a hairline between rows that starts past the icon. */
  #topbtns button { display: grid; grid-template-columns: 22px minmax(0, 1fr) 14px; align-items: center; gap: 14px;
    min-height: 60px; padding: 0 20px; border: 0; background: transparent; color: var(--fg);
    font: inherit; font-size: 16px; text-align: left; cursor: pointer; white-space: nowrap; }
  #topbtns button:not([hidden]) ~ button:not([hidden]) { background-image: linear-gradient(var(--hair), var(--hair));
    background-position: 56px 0; background-size: calc(100% - 76px) 1px; background-repeat: no-repeat; }
  #topbtns button:hover { background-color: var(--wash); }
  #topbtns button::before, #topbtns button::after { content: ""; height: 22px; background: currentColor;
    -webkit-mask: var(--icon, var(--i-dot)) center / contain no-repeat; mask: var(--icon, var(--i-dot)) center / contain no-repeat; }
  #topbtns button::after { --icon: var(--i-chevron); height: 14px; background: var(--faint); }
  #openMemory { --icon: var(--i-memory); } #openRoutines { --icon: var(--i-clock); } #openJobs { --icon: var(--i-jobs); }
  #openChat { --icon: var(--i-messages); } #openFamily { --icon: var(--i-people); } #openDevices { --icon: var(--i-devices); }
  #openSettings { --icon: var(--i-sliders); } #openTheme { --icon: var(--i-theme); } #toggleLog { --icon: var(--i-pulse); }

  /* Focus: while talking to Jarvis, everything but the orb, the status and the
     words fades away. A tap on empty space brings it back for a few seconds. */
  h1, #menuBtn, #talkrow, #tabs { transition: opacity .35s ease; }
  body.focus:not(.peek) h1,
  body.focus:not(.peek) #menuBtn,
  body.focus:not(.peek) #tabs,
  body.focus:not(.peek) #talkrow { opacity: 0; pointer-events: none; }

  #orbCanvas { position: absolute; inset: -22%; width: 144%; height: 144%;
    display: block; pointer-events: none; }
  #orb { position: absolute; inset: 0; border-radius: 50%; cursor: pointer;
    background: transparent; border: 0; -webkit-appearance: none; appearance: none; }
  #orb:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
  #orb.connecting { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .9 } 50% { opacity: 1 } }
  /* Fallback if WebGL is unavailable: the app must still be usable. */
  #orbWrap.nogl #orb { background: radial-gradient(circle at 50% 42%,
      color-mix(in srgb, var(--accent) 35%, var(--surface)) 0%, color-mix(in srgb, var(--accent) 12%, var(--bg)) 70%);
    box-shadow: 0 0 0 1px var(--hair) inset, 0 0 70px -14px var(--accent); }

  #status, #transcript { position: relative; z-index: 2; }
  #status { font-size: 17px; color: var(--dim); text-align: center; min-height: 24px; }
  #status.bad { color: var(--danger); }

  #transcript { width: min(760px, 100%); max-height: 26vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; padding: 0 4px; }
  /* Bubbles, as Hark's chat has them: Jarvis on the left, you on the right.
     Who said it is plain from the side, so the name is there for screen
     readers only. */
  .row { display: flex; flex-direction: column; align-items: flex-start; font-size: 15px; line-height: 1.4; }
  .row.you { align-items: flex-end; }
  .row .who { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .row .txt { max-width: min(480px, 88%); padding: 12px 16px; border-radius: 22px;
    background: var(--bubble); color: var(--fg); overflow-wrap: anywhere; }
  /* An answer stands out and a question steps back, as Hark's do: the answer solid, the question see-through and quieter. */
  .row.you .txt { background: var(--bubble-you); color: var(--dim); }
  .row .txt:empty { display: none; }
  /* What a routine said (fromRoutine.ts): its name in a pill on the asking side, hooked to its words below,
     as Hark shows what its checks found. Pressed, the routine opens. */
  .row.you.from { flex-direction: row; justify-content: flex-end; align-items: flex-end; column-gap: 2px; }
  .row span.hook { cursor: default; }
  .row .frompill { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: min(480px, 88%); min-height: 36px;
    padding: 6px 14px 6px 12px; border: 0; border-radius: 999px; background: var(--solid); color: var(--on-solid);
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  .row .frompill::before { content: ""; flex: none; width: 15px; height: 15px; background: currentColor;
    -webkit-mask: var(--i-clock) center / contain no-repeat; mask: var(--i-clock) center / contain no-repeat; }
  .row .frompill span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .frompill small { flex: none; font-size: 12px; opacity: .7; }
  /* The first run (firstRun.ts): Jarvis's words, then what to do next, in pills; gone once anything is said. */
  #transcript .row.jarvis.firstrun { flex-direction: column; align-items: flex-start; gap: 8px; }
  .row .frbtns { display: flex; flex-wrap: wrap; gap: 8px; }
  .row .frpill { min-height: 44px; padding: 8px 16px; border: 0; border-radius: 999px; background: var(--solid); color: var(--on-solid);
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  .row .frpill.quiet { background: var(--wash); color: var(--dim); }
  #transcript:has(> .row:not(.firstrun)) > .row.firstrun { display: none; }
  /* A background job's pill (fromRoutine.ts): "On it", breathing while it works, then named by its result. */
  .row .frompill.job::before { -webkit-mask-image: var(--i-jobs); mask-image: var(--i-jobs); }
  .row .frompill.working small { animation: pulse 1.3s ease-in-out infinite; }
  .routine.flash { animation: rflash 1.6s ease-out; }
  /* An answer's reply button, at its foot (reply.ts). */
  .row.jarvis { flex-direction: row; align-items: flex-end; gap: 2px; }
  .row .rpl { flex: none; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%;
    background: none; color: var(--faint); cursor: pointer; }
  .row .rpl:hover, .row .rpl:focus-visible { color: var(--fg); background: var(--wash); }
  .row .rpl::before { content: ""; width: 16px; height: 16px; background: currentColor;
    -webkit-mask: var(--i-reply) center / contain no-repeat; mask: var(--i-reply) center / contain no-repeat; }
  /* A question that replies to an answer: Hark's hook at its foot, which brings that answer back into view. */
  .row.you.replies { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; align-items: flex-end; column-gap: 2px; }
  .row.you.replies .att { flex-basis: 100%; max-width: none; }
  .row .hook { order: -1; position: relative; flex: none; width: 28px; height: 28px; margin-bottom: -10px; padding: 0; border: 0;
    background: none; color: var(--dim); cursor: pointer; }
  .row .hook::before { content: ""; position: absolute; left: 11px; top: 9px; width: 9px; height: 9px;
    border: 2px solid currentColor; border-right: 0; border-bottom: 0; border-top-left-radius: 7px; }
  .row.flash .txt { animation: rflash 1.6s ease-out; }
  @keyframes rflash { from { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 75%, transparent); } to { box-shadow: 0 0 0 3px transparent; } }
  /* What a question carried: its photos, and its files by name. */
  .row .att { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-end; gap: 6px; margin-bottom: 6px; max-width: min(480px, 88%); }
  .row .attimg { max-width: 180px; max-height: 140px; border-radius: 16px; object-fit: cover; }
  .row .att .tchip { padding-right: 14px; box-shadow: none; }
  /* A question Jarvis has received (main.ts sendTyped): "Read" under it, as Hark's chat says. */
  .row .seen { margin-top: 3px; font-size: 12px; color: var(--faint); }
  .row.you.replies .seen { flex-basis: 100%; text-align: right; }
  /* Jarvis at work (main.ts working, steps.ts): a pill per tool call, the running ones breathing, the finished ones ticked. */
  .row.working .steps { display: flex; flex-wrap: wrap; gap: 6px; max-width: min(480px, 88%); }
  .row .step { display: inline-flex; align-items: center; min-height: 30px; padding: 4px 12px; border-radius: 999px;
    background: var(--wash); color: var(--dim); font-size: 13px; font-weight: 500; }
  .row .step[hidden] { display: none; }
  .row .step.run, .row .step.think { color: var(--fg); animation: pulse 1.3s ease-in-out infinite; }
  .row .step.done { color: var(--faint); }
  .row .step.done::before { content: "✓"; margin-right: 6px; color: var(--ok); }

  #logWrap { position: fixed; inset: auto 0 0 0; height: 0; overflow: hidden; z-index: 10;
    background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border-top: 1px solid var(--hair); transition: height .2s ease; }
  #logWrap.open { height: 42vh; }
  #log { height: 100%; overflow-y: auto; padding: 10px 14px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ln { display: flex; gap: 10px; border-bottom: 1px solid var(--hair); padding: 2px 0; }
  .ln .t { flex: none; width: 250px; color: var(--accent-ink); }
  .ln .t.e { color: var(--danger); }
  .ln .j { color: var(--faint); word-break: break-all; }

  /* The panels: settings, devices, memory and the rest. Mostly phone-or-laptop
     jobs rather than driving ones — each means typing something the Tesla
     keyboard makes miserable. One shared class, because two id selectors per
     rule is how you end up with `#settings, #devices .sheet` styling the whole
     overlay. Each is a page, as Hark's settings are: full screen over the
     blurred app, a large title, round buttons to go back and to close (the
     close button keeps its word "Done" for screen readers and the behavior
     check, drawn as an X), and its content in cards. */
  .panel { position: fixed; inset: 0; z-index: 60; display: none; background: var(--scrim);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .panel.open { display: block; }
  .panel .sheet { height: 100%; overflow-y: auto; overscroll-behavior: contain;
    padding: var(--barTop) max(16px, calc((100% - 680px) / 2)) calc(32px + env(safe-area-inset-bottom)); }
  .panel header { display: flex; align-items: center; gap: 14px; min-height: 48px; margin-bottom: 16px; padding-right: 60px; }
  .panel h2 { margin: 0; font-size: 30px; font-weight: 400; line-height: 1.2; }
  .panel header .close, .panel header .back { flex: none; display: grid; place-items: center; width: 48px; height: 48px;
    min-height: 0; padding: 0; border: 0; border-radius: 50%; font-size: 0; background: var(--glass-hi); color: var(--fg);
    --icon: var(--i-back); }
  /* Back only from a section's page (below, and Messages' conversation on a phone). */
  .panel header .back { display: none; }
  .panel header .close { position: fixed; z-index: 2; top: var(--barTop); right: calc(14px + env(safe-area-inset-right));
    --icon: var(--i-close); }
  .panel header .close::before, .panel header .back::before { content: ""; width: 20px; height: 20px; background: currentColor;
    -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  .panel .note { color: var(--dim); font-size: 13px; margin: 6px 0 16px; }
  .panel .note:empty { display: none; }
  .panel code { background: var(--wash); padding: 1px 5px; border-radius: 4px; }
  .panel .srv { display: grid; gap: 8px; padding: 16px; margin-bottom: 10px; border-radius: 20px; background: var(--tile); }
  .panel input[type=text], .panel .srv input:not([type=checkbox]), .panel .svc input:not([type=checkbox]) {
    background: var(--field); color: var(--fg); border: 1px solid transparent;
    border-radius: 14px; padding: 11px 14px; font-size: 16px; font-family: inherit; min-height: 46px; width: 100%; }
  .panel input:focus-visible, .panel select:focus-visible, .panel textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .panel .on { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .panel .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .panel button { background: var(--surface-2); color: var(--fg); border: 1px solid transparent;
    border-radius: 999px; padding: 10px 18px; min-height: 44px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  .panel button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .panel .actions { display: flex; gap: 10px; margin-top: 8px; }
  .panel .res, .panel .msg { font: 12px/1.5 ui-monospace, Menlo, monospace;
    color: var(--faint); word-break: break-word; margin-top: 8px; }
  .panel .res.bad, .panel .msg.bad { color: var(--danger); }
  .panel h3 { margin: 22px 0 0; font-size: 17px; font-weight: 500; color: var(--fg); }
  .panel .router { display: grid; gap: 10px; padding: 20px; margin-top: 14px; border-radius: 24px; background: var(--glass-hi); }
  .panel .router h3 { margin: 0; }
  .panel .router .note { margin: 0; }
  .panel .now { font-size: 14px; color: var(--dim); display: grid; gap: 6px; }
  .panel .now b { color: var(--fg); font-weight: 600; }
  .panel .warn { color: var(--danger); font-size: 13px; line-height: 1.45; }
  /* 16px so iOS and Android do not zoom the page when it takes focus. */
  .panel select { background: var(--field); color: var(--fg); border: 1px solid transparent;
    border-radius: 14px; padding: 11px 14px; font-size: 16px; font-family: inherit; min-height: 46px; width: 100%; }
  .panel button:disabled, .panel select:disabled { opacity: .45; cursor: default; }

  /* Every setting (src/app/ui/Services.ts). Secrets are never on this page —
     only a fingerprint — so a field is blank until a replacement is typed.
     One column that may shrink below its content: without minmax(0, …) a long
     unbreakable value (a redirect URI) sets the width of the whole section and
     pushes it past the edge of a phone screen. */
  .panel .svc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 20px; margin-top: 14px;
    border-radius: 24px; background: var(--glass-hi); }
  .panel .note code { overflow-wrap: anywhere; }
  .panel .inforce { font-size: 14px; color: var(--dim); }
  .panel .inforce b { color: var(--fg); font-weight: 600; }
  .panel .svc h3 { margin: 0; }
  .panel .svc .note { margin: 0; }
  .panel .svchead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .panel .chip { font-size: 12px; letter-spacing: .2px; padding: 4px 10px; border-radius: 999px;
    border: 0; background: var(--wash); color: var(--dim); white-space: nowrap; }
  .panel .chip.on { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .panel .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel .check { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .panel .check.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .panel .field { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--hair); }
  .panel .fieldtop { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .panel .fieldtop label { font-size: 14px; color: var(--fg); }
  .panel .badge { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .panel .badge.saved { color: var(--accent-ink); }
  .panel .badge.unset { color: color-mix(in srgb, var(--warn) 60%, var(--fg)); }
  .panel .current { font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--fg); word-break: break-all; }
  .panel .current.secret { color: var(--dim); letter-spacing: .3px; }
  .panel .fieldfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .panel .fieldfoot .help { font-size: 12px; color: var(--faint); }
  .panel .fieldfoot button { min-height: 34px; padding: 4px 12px; font-size: 13px; }
  .panel .cmd { display: block; padding: 8px 10px; font-size: 13px; overflow-x: auto; white-space: nowrap; }

  /* Devices. Minting a credential is a phone-or-laptop job, never a driving one. */
  #devices .mint, #connect .mint { display: grid; gap: 10px; padding: 20px; margin-bottom: 14px; border-radius: 24px; background: var(--glass-hi); }
  #devices .scopes, #connect .scopes { display: grid; gap: 6px; }
  #devices .scope, #connect .scope { display: flex; align-items: flex-start; gap: 9px; font-size: 13px;
    color: var(--dim); cursor: pointer; }
  #devices .scope input, #connect .scope input { margin-top: 3px; min-width: 18px; min-height: 18px; }
  #devices .scope.wild, #connect .scope.wild { color: var(--fg); padding-bottom: 6px; border-bottom: 1px solid var(--hair); }
  #devices .dev { display: grid; gap: 8px; padding: 16px 20px; margin-bottom: 10px; border-radius: 24px; background: var(--glass-hi); }
  #devices .dev.dead { opacity: .5; }
  #devices .who { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  #devices .dim { color: var(--faint); font-size: 12px; }
  #devices .grants { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  #devices button.armed, #memory button.armed, #family button.armed { background: var(--danger); border-color: var(--danger);
    color: var(--on-accent); font-weight: 600; }
  /* The one moment the token is readable, so it gets the loudest box here. */
  #devices .token, #family .token { border: 1px solid var(--accent); border-radius: 24px;
    padding: 20px; margin-bottom: 16px; background: var(--glass-hi); }
  #devices .token p, #family .token p { color: var(--dim); font-size: 13px; margin: 8px 0; }
  #devices .tok, #family .tok { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #devices .tok code, #family .tok code { font: 13px ui-monospace, Menlo, monospace; word-break: break-all;
    flex: 1 1 260px; padding: 10px; }
  #devices .qr, #family .qr { background: #fff; padding: 10px; border-radius: 8px;
    width: max-content; margin: 12px 0; }
  #devices .qr svg, #family .qr svg { display: block; width: 190px; height: 190px; }
  /* Memory (src/app/ui/Memory.ts): every fact Jarvis carries, a section per kind, and a way to add or forget one. */
  #memory [hidden] { display: none !important; }
  #memory .setbody > .msg { margin: 0 0 10px; }
  #memory .setbody > .msg:empty { display: none; }
  #memory .gauge { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; gap: 10px;
    align-items: center; font-size: 13px; color: var(--dim); }
  #memory .bar { height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; }
  #memory .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  #memory .bar.full i { background: var(--warn); }
  #memory pre.profile { white-space: pre-wrap; word-break: break-word; margin: 0;
    font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--fg); background: var(--tile);
    border-radius: 16px; padding: 14px; }
  #memory .addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  #memory .fpin input { min-width: 18px; min-height: 18px; }
  #memory .named { display: grid; gap: 10px; }
  #memory .find { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  #memory .found { display: grid; gap: 8px; }
  #memory .found h4 { margin: 6px 0 0; font-size: 13px; font-weight: 500; color: var(--dim); }
  #memory .fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px;
    align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--tile); }
  #memory .ftxt { font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
  #memory .meta { grid-column: 1; font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
  #memory .fact .rowbtns { grid-column: 2; grid-row: 1 / span 2; justify-content: flex-end; }
  #memory .pin { color: var(--accent-ink); }
  #memory .dim { color: var(--faint); font-size: 12px; }
  #memory .gone { font-size: 13px; color: var(--dim); padding: 6px 0; border-top: 1px solid var(--hair); }
  @media (max-width: 520px) {
    #memory .gauge { grid-template-columns: minmax(0, 1fr); }
    #memory .fact { grid-template-columns: minmax(0, 1fr); }
    #memory .fact .rowbtns { grid-column: 1; grid-row: auto; justify-content: flex-start; }
  }

  /* The stage: a map or a street-level photo, filling the main view. */
  #stage { position: fixed; inset: 0; display: none; align-items: center;
    justify-content: center; z-index: 55; pointer-events: none;
    /* Clears the orb row above and the transcript below, at any size. */
    padding: calc(var(--orbSpan, 138px) + 14px) 12px 19vh; }
  #stage.open { display: flex; }
  #stage .frame { position: relative; max-width: 100%; max-height: 100%;
    border-radius: 24px; overflow: hidden; border: 1px solid var(--hair);
    background: var(--surface); box-shadow: var(--shadow);
    pointer-events: auto;
    animation: stageIn .45s cubic-bezier(.22,.9,.28,1) both; }
  /* The static image is 1280x800 (640x400 at scale 2). Letting it fill a wide
     viewport upscales past its own resolution and looks soft, so cap it at
     roughly its natural size and let the panel shrink around it instead.
     Sized against the VIEWPORT, not the panel: a percentage here refers back to
     the panel, which sizes itself from the image, so the browser cannot shrink
     the panel to fit — a 1920px camera frame left the panel full width with the
     picture in its left half. --stageH is the height left between the orb row
     and the transcript (the padding on #stage). */
  #stage { --stageW: calc(100vw - 24px);
    --stageH: calc(100dvh - var(--orbSpan, 138px) - 14px - 19vh); }
  #stage img { display: block; width: auto; height: auto;
    max-width: min(var(--stageW), 980px); max-height: var(--stageH);
    object-fit: contain; background: var(--surface); }
  /* A camera frame is full HD, and seeing it large is the point. */
  #stage .frame.camera img { max-width: min(var(--stageW), 1600px); }
  /* Until the first frame arrives — seconds, over a slow link home — a
     picture-shaped space rather than a sliver with a Close button on it. */
  #stage .frame.camera img:not([src]) { width: min(var(--stageW), 640px); aspect-ratio: 16 / 9; }
  #stage iframe { display: block; border: 0; background: var(--surface);
    width: min(1000px, 92vw); height: min(560px, 58vh); }
  #stage .frame { width: auto; }
  #stage .cap { position: absolute; left: 0; right: 0; bottom: 0;
    padding: 26px 16px 12px; font-size: 15px; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.72)); }
  /* Sized to be hit without aiming. Jarvis can also close it by voice, which is
     the intended way while moving — this is the fallback, not the mechanism. */
  #stage .close { position: absolute; top: 10px; right: 10px;
    min-height: 56px; min-width: 88px; padding: 12px 22px; border-radius: 999px; border: 0;
    background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    color: var(--fg); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  /* A picture Jarvis made (ui/Stage.ts showImage): Download, opposite Close. */
  #stage .dl { position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center;
    min-height: 56px; padding: 12px 22px; border-radius: 999px;
    background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    color: var(--fg); font-size: 15px; font-weight: 600; text-decoration: none; }
  #stage .dl[hidden] { display: none; }
  @keyframes stageIn { from { opacity: 0; transform: translateY(16px) scale(.97) }
                       to   { opacity: 1; transform: none } }


  /* Unlock screen. Everything here is oversized on purpose: it is used at arm's
     length on a dashboard, and this browser reports pointer:fine so nothing
     gets touch sizing for free. */
  #unlock { position: fixed; inset: 0; background: var(--backdrop); z-index: 50;
    display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px; }
  #unlock.show { display: flex; }
  #unlock p { color: var(--dim); margin: 0; text-align: center; font-size: 15px; }
  #keyInput { width: min(460px, 100%); height: 68px; text-align: center;
    background: var(--field); color: var(--fg); border: 1px solid transparent;
    border-radius: 18px; font: 600 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 3px; text-transform: uppercase; }
  #keyInput:focus { outline: none; border-color: var(--accent); }
  #keyGo { width: min(460px, 100%); height: 64px; background: var(--accent);
    color: var(--on-accent); border: 0; border-radius: 999px; font: inherit; font-size: 19px; font-weight: 600; cursor: pointer; }
  #keyGo:disabled { opacity: .35; }
  #keyErr { color: var(--danger); font-size: 14px; min-height: 20px; text-align: center; max-width: 460px; }
  #unlock .uview { width: min(460px, 100%); display: grid; gap: 14px; justify-items: stretch; }
  #unlock .uview[hidden] { display: none; }
  #unlock .dim { color: var(--dim); font-size: 13px; }
  #unlock button.big { height: 64px; background: var(--accent); color: var(--on-accent); border: 0;
    border-radius: 999px; font: inherit; font-size: 19px; font-weight: 600; cursor: pointer; }
  #unlock button.big.alt { background: var(--glass-hi); color: var(--fg); }
  #unlock button.big:disabled { opacity: .35; }
  #unlock .field { height: 60px; background: var(--field); color: var(--fg); border: 1px solid transparent;
    border-radius: 18px; font: inherit; font-size: 20px; padding: 0 16px; text-align: center; }
  #unlock .field:focus, #keyInput:focus { outline: none; border-color: var(--accent); }
  #unlock .paircode { text-align: center; font: 600 54px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 12px; color: var(--accent-ink); padding: 12px 0; }
  #unlock details summary { color: var(--dim); font-size: 14px; cursor: pointer; text-align: center; list-style: none; }
  #unlock details summary::-webkit-details-marker { display: none; }
  #unlock details[open] { gap: 12px; }
  #unlock details[open] summary { margin-bottom: 4px; }
  #unlock details > input, #unlock details > button { display: block; width: 100%; }
  /* Who is using it: the family as rows in one card, as Hark lists things. */
  #unlock .people { display: grid; border-radius: 24px; overflow: hidden; background: var(--glass-hi); }
  #unlock .people button { height: 64px; background: transparent; color: var(--fg); border: 0; border-radius: 0;
    font: inherit; font-size: 20px; font-weight: 500; cursor: pointer; display: flex; align-items: center;
    justify-content: space-between; padding: 0 20px; }
  #unlock .people button + button { background: linear-gradient(var(--hair), var(--hair)) 20px 0 / calc(100% - 40px) 1px no-repeat; }
  #unlock .people button.now { color: var(--accent-ink); }
  #unlock .people .tag { color: var(--dim); font-size: 14px; }
  #title.switchable { cursor: pointer; z-index: 58; padding: 6px 8px; margin: -6px -8px; }

  /* Viewport overrides last: these carry no extra specificity, so they only
     win by coming after the rules they override. */
  /* A phone. Narrow AND tall — where the Tesla's driving split is narrow and
     wide — so this keys on orientation as well as width, and both of the car's
     layouts are left exactly as they were. */
  @media (max-width: 620px) and (orientation: portrait) {
    /* Three tabs between the corner orb and the menu, on a 360px phone too. */
    #tabs button { padding: 0 14px; }
    /* No room for the name beside the tabs, and a phone is one person's anyway:
       switching who is using a shared screen is for the car or a tablet. */
    h1 { display: none; }
    /* Room for the tabs above and the home indicator below. */
    body { gap: 16px;
           padding: 74px 16px calc(20px + env(safe-area-inset-bottom)); }
    #orbWrap { --w: min(60vw, 40vh); width: var(--w);
      margin: 0 0 calc(var(--w) * 0.2); }
    #status { font-size: 16px; }
    #transcript { max-height: 22dvh; }
    /* How to talk under the status, as before: a phone held upright is too narrow beside the orb. */
    #talkrow { order: 1; }
    #transcript { order: 2; }
    #devices .qr svg, #family .qr svg { width: 150px; height: 150px; }
    #devices .tok code, #family .tok code { flex: 1 1 100%; }
  }

  /* A desktop window has room the dashboard does not. */
  @media (min-width: 1100px) and (min-height: 760px) {
    :root { --ow: min(40vh, 340px); }
    #status { font-size: 19px; }
  }

  /* Live or push-to-talk, per screen, under the orb: Tesla's segmented control,
     a raised pill on a sunken track. Out of the way while a picture is up. */
  #modes { position: relative; z-index: 2; display: flex; gap: 0; padding: 2px; border-radius: 999px;
    background: var(--wash); }
  #modes button { background: transparent; color: var(--dim); border: 0; border-radius: 999px; padding: 10px 18px;
    min-height: 44px; font: inherit; font-size: 13px; cursor: pointer; }
  #modes button.on { background: var(--seg-on); color: var(--fg); }
  body.staged #talkrow { display: none; }
  #talkrow { position: relative; z-index: 2; display: flex; gap: 10px; align-items: center; }
  /* The orb and how to talk are one row where the screen is wide: the orb centred between equal columns,
     Live over Push-to-talk on the right, and what it is doing in a small card under the orb. The row the
     switch took under the orb was the conversation's room in the car, which now takes all the height left.
     Elsewhere (a picture up, Chat, Home, a phone held upright) the row is not a box at all, and each part
     is placed as before. */
  #orbRow, #said { display: contents; }
  @media not all and (max-width: 620px) and (orientation: portrait) {
    /* The orb is drawn about a seventh wider than its box: the gap clears it, and so does the room above
       and below, or its top went under the tabs' glass and its foot under the status. */
    body:not(.staged):not(.typing):not(.home) #orbRow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      column-gap: calc(var(--ow) * .15 + 16px); row-gap: 6px; width: 100%; flex: none; }
    #orbRow > #orbWrap { grid-column: 2; }
    body:not(.staged):not(.typing):not(.home) { gap: 12px; }
    body:not(.staged):not(.typing):not(.home) #orbWrap { margin: calc(var(--ow) * .16) 0 calc(var(--ow) * .13); }
    /* What it is doing in a small frosted card under the orb, across the row so the orb's column keeps its
       width. Not there at all while it says nothing. */
    body:not(.staged):not(.typing):not(.home) #said { display: grid; gap: 2px; grid-column: 1 / -1; grid-row: 2; justify-self: center;
      max-width: min(420px, 100%); padding: 8px 18px; border-radius: 16px; border: 1px solid var(--hair); background: var(--glass);
      -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); text-align: center; }
    body:not(.staged):not(.typing):not(.home) #said:has(> #status:empty) { visibility: hidden; }
    body:not(.staged):not(.typing):not(.home) #status { min-height: 0; font-size: 14px; line-height: 1.35; text-align: center; color: var(--fg); }
    body:not(.staged):not(.typing):not(.home) #status.bad { color: var(--danger); }
    /* How to talk against the right edge: a tall narrow pill about as tall as the orb, each half elongated, its words small. */
    #orbRow > #talkrow { grid-column: 3; justify-self: end; }
    #orbRow #modes { flex-direction: column; width: 58px; }
    #orbRow #modes button { display: grid; place-items: center; min-height: min(calc(var(--ow) * .56), 112px); padding: 6px 4px;
      font-size: 11px; line-height: 1.25; text-align: center; }
    #transcript { flex: 0 1 auto; min-height: 0; max-height: none; }
  }

  /* The Chat tab: the orb steps into the corner, still alive and still the
     way to ask aloud; the conversation fills the screen, a message box sits at
     the bottom, and what Jarvis is doing is a caption just above it. */
  #typebar { display: none; }
  /* --kb is the height the on-screen keyboard takes where the browser does not
     shrink the page for it (Safari); 0 elsewhere. See keyboardSpace() in main.ts. */
  body.typing { justify-content: flex-start; gap: 12px; --orb: 40px;
    height: calc(100dvh - var(--kb, 0px));
    padding: calc(var(--barTop) + 64px) 16px calc(112px + var(--tray, 0px) + env(safe-area-inset-bottom)); }
  body.typing h1, body.typing #talkrow { display: none; }
  body.typing #orbWrap { position: fixed; top: calc(var(--barTop) + 6px); left: 18px; z-index: 3; width: var(--orb); margin: 0; }
  body.typing #status { position: fixed; z-index: 20; left: 16px; right: 16px; top: auto; max-width: none;
    bottom: calc(var(--kb, 0px) + 80px + var(--tray, 0px) + env(safe-area-inset-bottom)); min-height: 0; text-align: center;
    font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
  body.typing #transcript { flex: 1; min-height: 0; max-height: none; width: min(720px, 100%);
    padding-bottom: 8px; }
  body.typing #transcript .row { font-size: 16px; }
  body.typing #transcript .row .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  body.typing #transcript .row .txt a { color: var(--accent-ink); }
  #transcript .row.bad .txt { color: var(--danger); }
  /* A limit met (chat.ts): a notice in amber, as Hark's inline banner, after .bad so it wins for "bad limit". */
  #transcript .row.limit .txt { color: var(--fg); background: color-mix(in srgb, var(--warn) 16%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 45%, transparent); }
  /* The question being answered stays at the top while its answer is read (main.ts pin). Its see-through bubble
     is laid on the page's own colour so nothing shows through, and a long one is cut short. Not over the car's
     keyboard, whose band is too short to give a row up. */
  body.typing:not(.kbover) #transcript > .row.you.pinned { position: sticky; top: 0; z-index: 1; padding-bottom: 6px;
    background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  body.typing:not(.kbover) #transcript > .row.you.pinned .txt { background: linear-gradient(var(--bubble-you), var(--bubble-you)), var(--bg);
    max-height: 7.2em; overflow: hidden; }
  /* Clear chat (conversation.ts): above the conversation, in Chat, once there is one; two taps. */
  #chathead { display: none; }
  body.typing:not(.kbover):has(#transcript > .row) #chathead { display: flex; flex: none; justify-content: flex-end; width: min(720px, 100%); margin-bottom: -6px; }
  #clearChat { min-height: 40px; padding: 0 16px; border: 1px solid var(--hair); border-radius: 999px;
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    color: var(--dim); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  #clearChat.armed { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }
  /* The message box, Hark's: one glass pill holding the text and its buttons —
     dictate into it (asking aloud is the orb's in Chat), read replies aloud, and send. */
  body.typing #typebar { display: flex; position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
    bottom: calc(var(--kb, 0px) + 12px + env(safe-area-inset-bottom)); width: min(720px, calc(100vw - 28px));
    align-items: flex-end; gap: 2px; padding: 4px; border-radius: 26px; border: 1px solid var(--hair);
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    box-shadow: var(--shadow); }
  body.typing #typebar:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  /* 16px so iOS does not zoom the page when it takes focus. */
  #typebar textarea { flex: 1; resize: none; min-height: 44px; max-height: 30vh; border: 0; background: transparent;
    padding: 11px 8px 11px 14px; color: var(--fg); font: inherit; font-size: 16px; line-height: 1.4; }
  #typebar textarea:focus { outline: none; }
  #typebar textarea::placeholder { color: var(--faint); }
  #typebar > button { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: transparent; color: var(--dim); cursor: pointer; }
  #typebar > button::before { content: ""; width: 22px; height: 22px; background: currentColor;
    -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  #typebar #askAloud { --icon: var(--i-mic); }
  /* Taking down what is said (ptt.ts dictate): the mic in red, as a recorder's is. */
  #typebar #askAloud[aria-pressed="true"] { color: var(--danger); animation: pulse 1.3s ease-in-out infinite; }
  #typebar #readAloud { --icon: var(--i-speaker); }
  #typebar #readAloud[aria-pressed="true"] { --icon: var(--i-speaking); color: var(--accent-ink); }
  #typebar #send { --icon: var(--i-send); background: var(--solid); color: var(--on-solid); }
  #typebar #send:disabled { opacity: .45; cursor: default; }
  #typebar #attach { --icon: var(--i-plus); }
  /* "+": Upload file or Take photo, as Hark's (attach.ts). */
  #attachMenu { position: absolute; z-index: 2; right: 96px; bottom: calc(100% + 8px); display: grid; min-width: 200px; padding: 6px;
    border-radius: 20px; border: 1px solid var(--hair); background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    box-shadow: var(--shadow); }
  #attachMenu[hidden] { display: none; }
  #attachMenu button { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 0; border-radius: 14px;
    background: none; color: var(--fg); font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
  #attachMenu button:hover { background: var(--wash); }
  #attachMenu button::before { content: ""; width: 18px; height: 18px; background: currentColor;
    -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  #attachMenu [data-pick="file"] { --icon: var(--i-plus); }
  #attachMenu [data-pick="photo"] { --icon: var(--i-camera); }
  /* Above the box: the answer replied to, and the photos and files going with the question. */
  #tray { position: absolute; left: 6px; right: 6px; bottom: calc(100% + 8px); display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
  #tray[hidden] { display: none; }
  .tchip { position: relative; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 44px; padding: 4px 4px 4px 12px;
    border-radius: 16px; border: 1px solid var(--hair); background: var(--glass-hi); color: var(--fg);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shadow); font-size: 14px; }
  .tchip.img { padding: 0; width: 64px; height: 64px; overflow: hidden; }
  .tchip.img img { width: 100%; height: 100%; object-fit: cover; }
  .tchip.img .tremove { position: absolute; top: 2px; right: 2px; background: var(--glass-hi); }
  .tchip .ticon, .tchip.quote::before { flex: none; width: 18px; height: 18px; background: var(--dim); content: "";
    -webkit-mask: var(--icon, var(--i-note)) center / contain no-repeat; mask: var(--icon, var(--i-note)) center / contain no-repeat; }
  .tchip.quote { --icon: var(--i-reply); flex: 1 1 100%; }
  .tchip .tname, .tchip .tq { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tchip .tq { flex: 1; color: var(--dim); }
  .tremove { flex: none; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%;
    background: none; color: var(--dim); cursor: pointer; }
  .tremove::before { content: ""; width: 14px; height: 14px; background: currentColor;
    -webkit-mask: var(--i-close) center / contain no-repeat; mask: var(--i-close) center / contain no-repeat; }
  /* Take photo (attach.ts): the camera over the page, and the button to take it. */
  .camsheet { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; align-content: center; gap: 14px; padding: 24px;
    background: var(--scrim); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .camsheet video { width: min(720px, 100%); max-height: 62vh; border-radius: 22px; background: var(--surface); object-fit: cover; }
  .camsaid { max-width: 520px; margin: 0; color: var(--dim); font-size: 15px; text-align: center; }
  .camsaid:empty { display: none; }
  .camrow { display: flex; gap: 12px; }
  .camrow button { min-height: 48px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--hair); background: var(--glass-hi);
    color: var(--fg); font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; }
  .camrow .primary { border-color: transparent; background: var(--accent); color: var(--on-accent); }
  .camrow button:disabled { opacity: .45; cursor: default; }
  /* The car's keyboard covers the page without saying how much (keyboard.ts): typing there, the box goes up
     under the tabs, where the car puts its own, the newest messages in the band just under it. */
  body.typing.kbover { padding-top: calc(var(--barTop) + 130px + var(--tray, 0px)); }
  body.typing.kbover #typebar { top: calc(var(--barTop) + 64px); bottom: auto; }
  body.typing.kbover #transcript { flex: 0 1 auto; max-height: 34vh; }
  body.typing.kbover #status { display: none; }
  body.typing.kbover :is(#tray, #attachMenu) { top: calc(100% + 8px); bottom: auto; }
  /* Any other box is scrolled to the top of what scrolls it: room under it to scroll that far. */
  body.home.kbover #home, body.kbover .panel .sheet { padding-bottom: 60vh; }
  /* A picture while typing sits at the top of the chat, not over it. The
     staged rules above float the conversation over a dashboard; with typing's
     unlimited height that layer covered the picture, the orb and the menu.
     The picture takes up to 42% of what the keyboard leaves, the chat the rest. */
  body.typing #stage { position: relative; inset: auto; order: -1; flex: none; z-index: 2;
    width: min(820px, 100%); padding: 0;
    --stageW: min(820px, calc(100vw - 32px)); --stageH: calc((100dvh - var(--kb, 0px)) * .42); }
  body.typing #stage iframe { width: var(--stageW); height: var(--stageH); }
  body.typing.staged #transcript { position: relative; inset: auto; margin-inline: 0;
    max-height: none; padding: 0 4px 8px; z-index: 2; }

  /* Alerts: Jarvis speaking first. Above everything, including an open panel,
     because the settings panel's Test is one of the ways they arrive. */
  #alerts { position: fixed; z-index: 80; top: calc(var(--barTop) + 58px);
    left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
    display: grid; gap: 8px; pointer-events: none; }
  /* A glass card with a bar of Tesla blue at its edge, red when urgent. */
  #alerts .alert { pointer-events: auto; background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border-radius: 20px; padding: 12px 14px 14px 18px; box-shadow: inset 4px 0 0 var(--accent), var(--shadow);
    animation: alertIn .25s ease-out; }
  #alerts .alert.urgent { box-shadow: inset 4px 0 0 var(--danger), var(--shadow); }
  #alerts .ahead { display: flex; align-items: center; gap: 10px; }
  #alerts .ahead b { font-weight: 600; font-size: 14px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #alerts .ahead span { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  /* Hear it, and dismiss: round buttons drawn as icons (their aria-labels say which). */
  #alerts .ahead button { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
    background: var(--wash); color: var(--fg); font-size: 0; cursor: pointer; --icon: var(--i-close); }
  #alerts .ahead button.hear { --icon: var(--i-play); }
  #alerts .ahead button::before { content: ""; width: 18px; height: 18px; background: currentColor;
    -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  #alerts .alert.unplayed .hear { background: var(--accent); color: var(--on-accent); }
  #alerts .atext { margin-top: 6px; font-size: 15px; color: var(--fg); white-space: pre-wrap;
    overflow-wrap: anywhere; max-height: 30vh; overflow-y: auto; }
  @keyframes alertIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  /* Settings → Alerts: this device, and where alerts have gone. */
  .panel .alertbox { display: grid; gap: 10px; padding: 16px; border-radius: 18px; background: var(--tile); }
  .panel .alertbox h4 { margin: 4px 0 0; font-size: 13px; font-weight: 500; color: var(--dim); }
  .panel .alertbox ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .panel .alertbox li { display: flex; gap: 10px; align-items: baseline; justify-content: space-between;
    font-size: 13px; color: var(--fg); flex-wrap: wrap; }
  .panel .alertbox li small { color: var(--dim); }
  .panel .alertbox li.empty { color: var(--dim); }
  .panel .alertbox .thisdev { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }

  /* Settings, Family and Memory (src/app/ui/sections.ts), as Hark's settings:
     the sections as rows in cards — an icon, the name, how it stands, a
     chevron — each opening on a page of its own with a round back button,
     at every width, instead of every section one after another down a very
     long sheet. */
  .panel .setnav h4 { margin: 24px 20px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--dim); }
  .panel .setnav h4:first-child { margin-top: 4px; }
  .panel .navcard { display: grid; border-radius: 24px; overflow: hidden; background: var(--glass-hi); }
  .panel .navcard > button { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 14px; align-items: center;
    gap: 14px; min-height: 60px; padding: 0 20px; border: 0; border-radius: 0; background: transparent;
    color: var(--fg); font-size: 16px; font-weight: 400; text-align: left; }
  .panel .navcard > button + button { background: linear-gradient(var(--hair), var(--hair)) 56px 0 / calc(100% - 76px) 1px no-repeat; }
  .panel .navcard > button:hover { background-color: var(--wash); }
  .panel .navcard > button::before, .panel .navcard > button::after { content: ""; height: 22px; background: currentColor;
    -webkit-mask: var(--icon, var(--i-dot)) center / contain no-repeat; mask: var(--icon, var(--i-dot)) center / contain no-repeat; }
  .panel .navcard > button::after { --icon: var(--i-chevron); height: 14px; background: var(--faint); grid-column: 4; }
  .panel .setnav .st { font-size: 14px; font-weight: 700; }
  .panel .setnav .st.on { color: var(--ok); }
  .panel .setnav .st.need { color: var(--danger); }
  .panel .setnav .st.off { color: var(--faint); }
  .panel .setnav .st.aside { color: var(--dim); font-weight: 400; font-variant-numeric: tabular-nums; }
  .panel .setnav .navnote { font-size: 13px; color: var(--dim); margin: 16px 20px 0; line-height: 1.45; }
  .panel .setnav .navver { font-size: 12px; color: var(--faint); margin: 10px 20px 0; font-variant-numeric: tabular-nums; }
  .panel .setnav .navver:empty { display: none; }
  .panel .setnav .navver.update { color: var(--fg); }
  .panel .setnav .navver a { color: var(--accent-ink); }
  /* Which icon a row has, by its section's id. */
  .navcard [data-for="chatgpt"] { --icon: var(--i-messages); }
  /* Settings → ChatGPT plan (ui/ChatGptPlan.ts): its steps, buttons and paste box spaced like a form. */
  #settings .planbody { display: grid; gap: 12px; margin-top: 12px; }
  #settings .planbody > * { margin: 0; }
  #settings .planbody ol { padding-left: 20px; display: grid; gap: 4px; }
  .navcard [data-for="openai"] { --icon: var(--i-bolt); }
  .navcard :is([data-for="car"], [data-for="m-cars"], [data-for$=":vehicle"]) { --icon: var(--i-car); }
  .navcard :is([data-for="home"], [data-for="m-home"]) { --icon: var(--i-house); }
  .navcard [data-for="hermes"] { --icon: var(--i-terminal); }
  .navcard [data-for="google"] { --icon: var(--i-mail); }
  .navcard [data-for="spotify"] { --icon: var(--i-music); }
  .navcard :is([data-for="maps"], [data-for$=":place"]) { --icon: var(--i-pin); }
  .navcard [data-for="cameras"] { --icon: var(--i-camera); }
  .navcard [data-for="mcp"] { --icon: var(--i-plug); }
  .navcard [data-for="router"] { --icon: var(--i-route); }
  .navcard :is([data-for="voice"], [data-for="m-voice"]) { --icon: var(--i-wave); }
  .navcard [data-for="screen"] { --icon: var(--i-screen); }
  .navcard :is([data-for="alerts"], [data-for="m-alerts"]) { --icon: var(--i-bell); }
  .navcard [data-for="locale"] { --icon: var(--i-globe); }

  .navcard [data-for="pass"] { --icon: var(--i-ticket); }
  .navcard :is([data-for="you"], [data-for^="member:"], [data-for$=":person"]) { --icon: var(--i-person); }

  .navcard [data-for="find"] { --icon: var(--i-search); }

  /* Settings → Usage and cost. */
  .panel .usagenow { gap: 8px; }
  .panel .usagenow h4 { margin: 10px 0 0; font-size: 13px; font-weight: 500; color: var(--fg); }
  .panel .usagenow ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
  .panel .setbody [data-section]:not(.active) { display: none; }
  .panel .setbody .svc h4 { margin: 6px 0 0; font-size: 13px; font-weight: 500; color: var(--dim); }
  .panel .setbody .svc.active { margin-top: 0; }
  /* The list, then one section in its place. On a section's page its own heading is the title.
     Only the sections hide under the list: a load error or a warning beside them still shows. */
  .panel .setsheet:not(.detail) .setbody [data-section], .panel .setsheet.detail .setnav,
  .panel .setsheet.detail h2 { display: none; }
  .panel .setsheet.detail .back { display: grid; }
  .panel .setsheet.detail .setbody .active .svchead h3,
  .panel .setsheet.detail .setbody .active > h3:first-child { font-size: 26px; font-weight: 400; }

  /* Routines. */

  .panel .routine .rwhen { font-size: 13px; color: var(--fg); overflow-wrap: anywhere; }
  .panel .routine .rfacts { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
  .panel .routine .rfacts.bad { color: var(--danger); }
  .panel .rform { display: grid; gap: 8px; margin-top: 10px; }
  .panel .rform input:not([type=checkbox]), .panel .rform textarea {
    background: var(--field); color: var(--fg); border: 1px solid transparent; border-radius: 14px;
