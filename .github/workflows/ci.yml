name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A fresh clone has only the template, exactly like a new user.
      - run: cp wrangler.example.jsonc wrangler.jsonc
      - run: npx wrangler types
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t jarvis-ci .

      - name: Refuses to start without an owner key
        run: |
          if timeout 60 docker run --rm jarvis-ci; then echo "started with no key"; exit 1; fi

      - name: Starts, keeps data across a restart, and checks the key
        timeout-minutes: 8
        run: |
          set -eu
          KEY=CITESTKEY1234567
          c() { curl --max-time 10 "$@"; }
          probe() { curl --max-time 3 "$@"; }
          wait_up() {
            for i in $(seq 1 45); do
              probe -fs http://127.0.0.1:8787/ >/dev/null && { echo "up after about $((i * 2))s"; return 0; }
              sleep 2
            done
            docker logs jarvis; return 1
          }
          docker volume create jarvis-ci-data
          docker run -d --name jarvis -p 8787:8787 -e JARVIS_SHARED_SECRET=$KEY -v jarvis-ci-data:/data jarvis-ci
          wait_up

          test "$(c -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/health -H 'X-Jarvis-Key: WRONGKEY')" = 401
          c -fs http://127.0.0.1:8787/api/health -H "X-Jarvis-Key: $KEY"

          # The runtime's developer page of everything stored answers "localhost" with no key, and it keeps a trace
          # of every call: both off (docker/entrypoint.sh). What is there instead is the app.
          for p in /cdn-cgi/local/explorer /cdn-cgi/local/explorer/api/local/workers; do
            c -fsL http://127.0.0.1:8787$p -H 'Host: localhost' | grep -q '<title>Jarvis</title>'
          done
          docker exec jarvis sh -c 'test -d /data/v3/do && test ! -e /data/v3/observability'

          c -fs -X PUT http://127.0.0.1:8787/api/settings -H "X-Jarvis-Key: $KEY" \
            -H 'Content-Type: application/json' -d '{"changes":{"TIMEZONE":"Europe/London"}}' >/dev/null

          docker rm -f jarvis
          docker run -d --name jarvis -p 8787:8787 -e JARVIS_SHARED_SECRET=$KEY -v jarvis-ci-data:/data jarvis-ci
          wait_up

          c -fs http://127.0.0.1:8787/api/settings -H "X-Jarvis-Key: $KEY" \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));const t=d.settings.find(s=>s.name==='TIMEZONE');if(t.display!=='Europe/London'||t.source!=='saved'){console.error('lost across restart',t);process.exit(1)}console.log('setting survived the restart:',t.display)"
          docker rm -f jarvis

      - name: The workshop keeps a job to itself, with no network
        timeout-minutes: 12
        run: |
          set -eu
          TOKEN=ci-workshop-token-0123456789
          printf 'JARVIS_SHARED_SECRET=CITESTKEY1234567\nWORKSHOP_URL=http://127.0.0.1:9377\nWORKSHOP_TOKEN=%s\n' "$TOKEN" > .env
          docker compose --profile workshop up -d --build jarvis workshop workshop-door
          for i in $(seq 1 30); do
            docker compose --profile workshop logs workshop workshop-door 2>&1 | grep -q 'door: open' && break
            sleep 2
          done
          docker image ls jarvis-workshop
          docker compose --profile workshop exec -T -e TOKEN="$TOKEN" jarvis node --input-type=module - < docker/workshop/check.mjs

      - name: Container logs
        if: always()
        run: |
          docker logs jarvis 2>&1 | tail -80 || true
          docker compose --profile workshop logs workshop workshop-door 2>&1 | tail -40 || true
