# docker compose up -d                   Jarvis on http://localhost:8787
# docker compose --profile https up -d   plus automatic HTTPS for JARVIS_DOMAIN
#
# Put JARVIS_SHARED_SECRET (and, for https, JARVIS_DOMAIN) in a .env file next
# to this one. Browsers only allow the microphone over HTTPS — or on localhost —
# so anything beyond this machine needs the https profile, or a tunnel such as
# Cloudflare Tunnel or Tailscale in front.
services:
  jarvis:
    build: .
    image: jarvis-voice-agent
    restart: unless-stopped
    environment:
      JARVIS_SHARED_SECRET: ${JARVIS_SHARED_SECRET:?set JARVIS_SHARED_SECRET in .env}
      # Behind the https profile, Google and Spotify sign-in must return to the
      # public address, not the proxy's plain http hop.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Only while moving this Jarvis elsewhere (README: Moving Jarvis).
      # With the browser profile below: http://127.0.0.1:9222 (or set it in the settings panel).
      BROWSER_URL: ${BROWSER_URL:-}
      MOVE_KEY: ${MOVE_KEY:-}
      JARVIS_STANDBY: ${JARVIS_STANDBY:-}
      # With the workshop profile below: http://127.0.0.1:9377, and a token of 24 characters or more, the same for its door.
      WORKSHOP_URL: ${WORKSHOP_URL:-}
      WORKSHOP_TOKEN: ${WORKSHOP_TOKEN:-}
    ports:
      - "${JARVIS_PORT:-8787}:8787"
    volumes:
      - jarvis-data:/data

  # A full browser for Jarvis to drive, and for a person to take over when a
  # page asks for one: `--profile browser`. It lives inside Jarvis's own network
  # (network_mode), so Jarvis reaches it on 127.0.0.1 (the browser's debugging
  # port 9222, its screen on 3000) and nothing else can: none of its ports is
  # published. Anyone who reached that screen would be signed in as the family.
  browser:
    image: lscr.io/linuxserver/chromium:latest
    profiles: ["browser"]
    restart: unless-stopped
    depends_on: [jarvis]
    network_mode: "service:jarvis"
    environment:
      TZ: ${TIMEZONE:-Etc/UTC}
      # The profile stays where the image keeps it: there the image clears the lock a
      # replaced container leaves behind. Anywhere else, the browser starts into "the
      # profile is in use by another computer" and never opens its debugging port.
      # Restoring its last session keeps a sign-in that a site holds only while the
      # browser is open (an older system's), across a restart of this container.
      CHROME_CLI: --remote-debugging-port=9222 --restore-last-session
      # No terminal, no sudo, no closing the browser from its screen.
      HARDEN_DESKTOP: "true"
      HARDEN_OPENBOX: "true"
      TITLE: Jarvis browser
      # Jarvis never uses the image's web desktop (its panel goes through port 9222), but
      # it listens all the same, without a login, and the image lets a page of ANY site
      # open its control socket ("*"). Empty is the desktop's own origin only: a page this
      # browser opens cannot drive the browser through it. No files in or out, no links.
      SELKIES_ALLOWED_ORIGINS: ""
      SELKIES_FILE_TRANSFERS: none
      SELKIES_ENABLE_SHARING: "false"
    volumes:
      - browser-data:/config
    # Chrome keeps page memory in /dev/shm; the default 64 MB crashes modern sites.
    shm_size: "1gb"
    mem_limit: 2g

  # Where a background job may run code and make files: `--profile workshop`,
  # with WORKSHOP_TOKEN in .env. It has no network at all: the one way in is a
  # socket on a volume of its own, and the one thing that holds its other end is
  # its door, in Jarvis's own network, where nothing is published. Nothing of
  # Jarvis's is mounted in it. What it can do is in docker/workshop/Dockerfile;
  # what a job there is kept to, in runner.mjs.
  workshop:
    build: docker/workshop
    image: jarvis-workshop
    profiles: ["workshop"]
    restart: unless-stopped
    network_mode: none
    # No place every job may write: no /tmp, and no shared memory. Each has a folder of its own for such things.
    ipc: none
    read_only: true
    cap_drop: [ALL]
    # To be each job's own user, give it its folder, and end what it left running. Not to open what is another's.
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1200m
    # The same, so no swap: a job out of memory is ended, rather than the whole machine made to wait.
    memswap_limit: 1200m
    # Where the kernel can; each job's own processes are limited either way (runner.mjs).
    pids_limit: 1000
    cpu_shares: 256
    volumes:
      - workshop-files:/work
      - workshop-socket:/run/workshop
  workshop-door:
    image: jarvis-workshop
    profiles: ["workshop"]
    restart: unless-stopped
    depends_on: [jarvis, workshop]
    network_mode: "service:jarvis"
    read_only: true
    cap_drop: [ALL]
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    environment:
      WORKSHOP_TOKEN: ${WORKSHOP_TOKEN:-}
    volumes:
      - workshop-socket:/run/workshop
      - sites-socket:/run/sites
    command: ["node", "/opt/workshop/door.mjs"]

  # Where a site a job built is published, by a tap: `--profile workshop --profile sites`.
  # Static files on a port of their own, read only, for whoever is on this network (or
  # behind a proxy of yours); put there through a socket that the door holds and the
  # workshop does not. SITES_ADDRESS is where you open it, for Jarvis to say;
  # SITES_DIR, a folder of this machine's to keep them in (one user 1000 may write).
  sites:
    image: jarvis-workshop
    profiles: ["sites"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    environment:
      SITES_ADDRESS: ${SITES_ADDRESS:-}
    ports:
      - "${SITES_PORT:-8090}:8090"
    volumes:
      - ${SITES_DIR:-sites-files}:/sites
      - sites-socket:/run/sites
    command: ["node", "/opt/workshop/sites.mjs"]

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [jarvis]
    environment:
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  jarvis-data:
  browser-data:
  workshop-files:
  workshop-socket:
  sites-files:
  sites-socket:
  caddy-data:
